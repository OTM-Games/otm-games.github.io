<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godspeed 💤 Good Try</title>
<style>
:root { --fg: #f3f0ff; --dim: #a79fc4; --bolt: #bfe4ff; --gold: #ffd76a; --line: #3b3060; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #0b0820; color: var(--fg); font: 15px system-ui, sans-serif; overflow: hidden; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, rgba(70, 50, 140, 0.55), rgba(8, 6, 22, 0.94) 70%); z-index: 3; }
.screen h1 { margin: 0; font: 900 clamp(48px, 11vw, 120px) / 0.9 system-ui, sans-serif; letter-spacing: -0.04em; font-style: italic; background: linear-gradient(180deg, #fff 30%, var(--bolt)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px rgba(150, 200, 255, 0.55)); }
.screen h1.name { font-size: clamp(30px, 7.4vw, 92px); display: flex; align-items: center; gap: 0.12em; white-space: nowrap; }
.screen h1.name .zzz { display: inline-flex; align-items: flex-end; height: 1em; padding: 0 0.12em 0 0.04em; font-style: italic; -webkit-text-fill-color: #e8f0ff; filter: drop-shadow(0 0 10px rgba(180, 210, 255, 0.7)); }
.screen h1.name .zzz i { font-style: italic; display: inline-block; position: relative; margin: 0 0.04em; line-height: 1; animation: snooze 2.6s ease-in-out infinite; }
.screen h1.name .zzz i:nth-child(1) { font-size: 0.32em; bottom: 0.1em; animation-delay: 0s; }
.screen h1.name .zzz i:nth-child(2) { font-size: 0.45em; bottom: 0.6em; animation-delay: 0.35s; }
.screen h1.name .zzz i:nth-child(3) { font-size: 0.62em; bottom: 0.85em; animation-delay: 0.7s; }
@keyframes snooze { 0%, 100% { opacity: 0.35; translate: 0 0.12em; } 50% { opacity: 1; translate: 0 -0.12em; } }
.screen .sub { font: 700 14px ui-monospace, Menlo, monospace; letter-spacing: 0.5em; color: var(--dim); text-transform: uppercase; margin-top: -6px; }
.screen button { font: 800 17px system-ui, sans-serif; padding: 13px 26px; border-radius: 12px; border: 0; background: var(--fg); color: #0b0820; cursor: pointer; min-width: 220px; }
.screen button.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.keys { display: grid; grid-template-columns: auto auto; gap: 6px 18px; text-align: left; color: var(--dim); font-size: 14px; margin: 6px 0; }
.keys b { color: var(--fg); font: 700 13px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; display: inline-block; min-width: 26px; text-align: center; }
.best { color: var(--gold); font: 700 15px ui-monospace, Menlo, monospace; }
.row { display: flex; gap: 10px; align-items: center; color: var(--dim); }
.row input { accent-color: var(--bolt); width: 180px; }
.big { font: 900 clamp(40px, 8vw, 80px) ui-monospace, Menlo, monospace; color: #fff; }
.err { color: #ff8a9a; max-width: 420px; }
.screen.modes { background: #d9d9d9; overflow: hidden; }
.modes .marble { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; mix-blend-mode: multiply; }
.modes::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.65), rgba(255,255,255,0) 60%), linear-gradient(90deg, rgba(110,110,115,0.45), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(110,110,115,0.45)); pointer-events: none; }
.mode-row { position: relative; display: flex; gap: clamp(20px, 8vw, 140px); flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.screen .mode { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .15s; }
.screen .mode canvas { position: static; inset: auto; display: block; width: clamp(220px, 30vw, 380px); height: auto; image-rendering: pixelated; }
.mode b { font: 900 clamp(16px, 2.2vw, 26px)/1.1 'Arial Black', Impact, system-ui, sans-serif; color: #777; -webkit-text-stroke: 1.5px #2a2a2c; paint-order: stroke fill; text-align: center; letter-spacing: -0.01em; }
.mode small { font: 900 clamp(11px, 1.3vw, 15px) 'Arial Black', Impact, system-ui, sans-serif; color: #777; -webkit-text-stroke: 1px #2a2a2c; paint-order: stroke fill; }
.screen .mode:hover, .screen .mode:focus-visible { transform: scale(1.05) rotate(-1deg); }
.mode:hover b, .mode:focus-visible b { color: #ededed; }
.mode-best { position: relative; font: 700 13px ui-monospace, Menlo, monospace; color: #333; }
.screen .mode-back { all: unset; position: relative; cursor: pointer; font: 700 14px system-ui, sans-serif; color: #333; padding: 8px 14px; border-radius: 8px; }
.screen .mode-back:hover { background: rgba(0,0,0,0.08); }
.binds { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 10px; align-items: center; text-align: left; width: min(520px, 100%); }
.binds span { color: var(--dim); font-size: 14px; }
.binds button { min-width: 0; padding: 8px 10px; font: 700 13px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.08); color: var(--fg); border: 1.5px solid var(--line); border-radius: 8px; }
.binds button.wait { background: var(--bolt); color: #0b0820; border-color: var(--bolt); }
.binds button.clash { border-color: #ff8a9a; }
.screen .small { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div class="screen" id="title">
  <h1 class="name">GODSPEED<span class="zzz" aria-label="z z z"><i>z</i><i>z</i><i>Z</i></span>GOOD TRY</h1>
  <div class="best" id="bestT"></div>
  <button id="play">▶ Play</button>
  <button class="ghost" id="bindsBtn">⌨ Keybinds</button>
  <div class="keys" id="keyList"></div>
  <div class="sub" style="letter-spacing:.15em;font-size:12px">slide → jump keeps your momentum · slide in the air to dive</div>
  <div class="err" id="err"></div>
</div>

<div class="screen" id="pause" hidden>
  <h1 style="font-size:64px">PAUSED</h1>
  <button id="resume">▶ Resume</button>
  <button class="ghost" id="restart">↺ Restart run</button>
  <button class="ghost" id="toLobby">⌂ Back to lobby</button>
  <label class="row">mouse speed <input type="range" id="sens" min="0.3" max="3" step="0.05"></label>
  <label class="row">volume <input type="range" id="vol" min="0" max="1" step="0.05"></label>
  <label class="row">field of view <input type="range" id="fov" min="70" max="110" step="1"></label>
  <button class="ghost" id="bindsBtn2">⌨ Keybinds</button>
</div>

<div class="screen" id="bindsScreen" hidden>
  <h1 style="font-size:56px">KEYBINDS</h1>
  <div class="small">click a box, then press a key or mouse button · Esc cancels · Backspace clears</div>
  <div class="binds" id="bindList"></div>
  <div class="row"><button class="ghost" id="bindsReset" style="min-width:0">↺ Defaults</button><button id="bindsDone" style="min-width:0">✓ Done</button></div>
</div>

<div class="screen modes" id="modes" hidden>
  <svg class="marble" aria-hidden="true"><filter id="mf"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="5" seed="4"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.52  0 0 0 -1.6 1.25"/></filter><rect width="100%" height="100%" filter="url(#mf)"/></svg>
  <div class="mode-row">
    <button class="mode" data-mode="sleep"><canvas width="420" height="270"></canvas><b>GET TO YOUR BED PLEASE...</b></button>
    <button class="mode" data-mode="sleeprunning"><canvas width="420" height="270"></canvas><b>ITS JUST A BAD DREAM..</b></button>
  </div>
  <div class="mode-best" id="modeBest"></div>
  <button class="mode-back" id="modeBack">← back</button>
</div>

<div class="screen" id="done" hidden>
  <div class="sub">you finally sleep</div>
  <div class="big" id="doneT"></div>
  <div class="best" id="doneB"></div>
  <div class="small" id="doneD"></div>
  <button id="again">↺ Run it again</button>
  <button class="ghost" id="doneLobby">⌂ Lobby</button>
</div>

<script>
(() => {
'use strict';
// ===================== GODSPEED zZ GOOD TRY =====================
// A movement game: run, slide, and wall jump your way to the end of the course as fast as you can.
const $ = (id) => document.getElementById(id);
const glc = $('gl'), hud = $('hud'), hx = hud.getContext('2d');
const gl = glc.getContext('webgl2', { antialias: true });
if (!gl) { $('err').textContent = "Your browser can't run 3D games (WebGL2 is off). Try Chrome or Edge."; $('play').hidden = true; return; }
const store = { get(k, d) { try { const v = localStorage.getItem('godspeed-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('godspeed-' + k, JSON.stringify(v)); } catch (e) {} } };
const settings = Object.assign({ sens: 1, vol: 0.7, fov: 90 }, store.get('settings', {}));
// keybinds: each action has two slots. Mouse buttons are 'Mouse0' (left), 'Mouse1' (middle), 'Mouse2' (right)
const ACTIONS = [
  ['forward', 'run forward (you speed up the longer you run)'], ['back', 'back'], ['left', 'left'], ['right', 'right'],
  ['jump', 'jump'], ['slide', 'slide: keeps your speed, faster downhill. In the air: dive'], ['reset', 'back to the last checkpoint'],
];
const DEFAULT_BINDS = { forward: ['KeyW', 'ArrowUp'], back: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['Space', ''], slide: ['KeyC', 'ControlLeft'], reset: ['KeyR', ''] };
const binds = JSON.parse(JSON.stringify(DEFAULT_BINDS));
{ const saved = store.get('binds', null); if (saved) for (const [a] of ACTIONS) if (Array.isArray(saved[a])) binds[a] = [saved[a][0] || '', saved[a][1] || '']; }
const keyName = (c) => !c ? '—' : c === 'Mouse0' ? 'LMB' : c === 'Mouse1' ? 'MMB' : c === 'Mouse2' ? 'RMB' : c === 'Space' ? 'Space' : c.startsWith('Key') ? c.slice(3) : c.startsWith('Digit') ? c.slice(5) : c.startsWith('Arrow') ? { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→' }[c] : c.replace('Left', ' L').replace('Right', ' R').replace('Control', 'Ctrl');
const actionOf = (code) => { for (const [a] of ACTIONS) if (binds[a].includes(code)) return a; return null; };
let W = 0, H = 0, DPR = 1;
function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; glc.width = W * DPR; glc.height = H * DPR; hud.width = W * DPR; hud.height = H * DPR; hx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', size); size();

// ---------- tiny math ----------
const V = { add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], len: (a) => Math.hypot(a[0], a[1], a[2]), norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; } };
function perspective(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f); return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]; }
function viewMat(eye, f, u, r) { return [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -V.dot(r, eye), -V.dot(u, eye), V.dot(f, eye), 1]; }
function mmul(a, b) { const o = new Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }

// ---------- shaders ----------
function prog(vs, fs) {
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.bindAttribLocation(p, 1, 'aNor'); gl.bindAttribLocation(p, 2, 'aCol'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const WORLD = prog(`#version 300 es
in vec3 aPos; in vec3 aNor; in vec3 aCol;
uniform mat4 uVP; out vec3 vPos; out vec3 vNor; out vec3 vCol;
void main() { vPos = aPos; vNor = aNor; vCol = aCol; gl_Position = uVP * vec4(aPos, 1.0); }`,
`#version 300 es
precision highp float;
in vec3 vPos; in vec3 vNor; in vec3 vCol; out vec4 o;
uniform vec3 uCam; uniform vec3 uFog; uniform float uFlash; uniform vec3 uBolt; uniform float uBoltT; uniform float uStyle; uniform float uFogK;
uniform mat4 uL; uniform highp sampler2DShadow uSh; uniform float uShOn;
void main() {
  vec3 n = normalize(vNor), sun = normalize(vec3(-0.45, 0.8, 0.38));
  // shadows from the sun (a shadow map, softened a little)
  float sh = 1.0;
  if (uShOn > 0.5) {
    vec4 lp = uL * vec4(vPos + n * 0.06, 1.0); vec3 l = lp.xyz * 0.5 + 0.5;
    if (l.x > 0.0 && l.x < 1.0 && l.y > 0.0 && l.y < 1.0 && l.z < 1.0) {
      sh = 0.0; float t = 1.0 / 2048.0;
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) sh += texture(uSh, vec3(l.xy + vec2(i, j) * t * 1.5, l.z - 0.0015));
      sh /= 9.0;
    }
  }
  float nd = max(dot(n, sun), 0.0);
  float d = 0.42 + 0.7 * nd * sh + 0.08 * max(n.y, 0.0) - 0.12 * max(-n.y, 0.0);
  vec3 c = vCol * d;
  if (uStyle > 1.5) { // the rest room: speckled purple floor, squiggly glowing walls
    c = vCol * (0.85 + 0.3 * nd * sh + 0.08 * max(n.y, 0.0));
    if (uStyle > 2.5) { vec3 vd = normalize(uCam - vPos); float fc = abs(dot(n, vd)); c = vCol * (0.72 + 0.3 * fc + 0.12 * nd) + vec3(0.1, 0.05, 0.12) * pow(1.0 - fc, 3.0); } // the flower NPC: soft and rounded
    else if (n.y > 0.8) { float sp = fract(sin(dot(floor(vPos.xz * 9.0), vec2(12.9898, 78.233))) * 43758.5453); c *= 0.8 + 0.35 * sp; }
    else { float sq = abs(sin(dot(vPos, vec3(2.3, 3.1, 1.7)) + sin(vPos.y * 5.0 + vPos.x * 2.0 + vPos.z * 1.3) * 2.2)); c *= 0.72 + 0.55 * smoothstep(0.82, 1.0, sq); }
  } else
  if (uStyle > 0.5 && n.y > 0.8) { // the dream path: big square stone tiles
    vec2 g = vPos.xz / 1.4; vec2 fq = abs(fract(g) - 0.5); float fw2 = fwidth(g.x) + fwidth(g.y);
    float edge = smoothstep(0.47 - fw2, 0.5, max(fq.x, fq.y)), rn = fract(sin(dot(floor(g), vec2(12.9898, 78.233))) * 43758.5453), fade = 1.0 - smoothstep(0.25, 0.8, fw2);
    c *= (0.9 + 0.16 * rn * fade) * (1.0 - 0.45 * edge * fade);
  } else
  // little studs on top of everything, like old bricks
  if (n.y > 0.95) {
    vec2 st = fract(vPos.xz * 3.0) - 0.5; float r = length(st), fw = fwidth(vPos.x * 3.0);
    float fade = 1.0 - smoothstep(0.15, 0.45, fw); // far away the studs blur out
    c *= 1.0 + fade * (0.045 * smoothstep(0.3, 0.22, r) * (st.x - st.y + 0.3) - 0.04 * smoothstep(0.34, 0.3, r) * smoothstep(0.26, 0.3, r));
  } else {
    // faint block lines on the sides
    vec3 q = vPos * vec3(1.0, 2.0, 1.0), w = fwidth(q) * 1.2, g = smoothstep(w, vec3(0.0), abs(fract(q) - 0.5) - 0.5 + w);
    vec3 an = abs(n); float line = max(max(g.x * (1.0 - an.x), g.y * (1.0 - an.y)), g.z * (1.0 - an.z));
    c *= 1.0 - 0.1 * line;
  }
  // a wall jump spark lights up what's near it
  float bl = uBoltT * 6.0 / (1.0 + dot(vPos - uBolt, vPos - uBolt) * 0.15);
  c += vec3(0.7, 0.8, 1.0) * bl;
  float dist = length(vPos - uCam), fog = 1.0 - exp(-dist * uFogK);
  fog = max(fog, smoothstep(-20.0, -70.0, vPos.y) * 0.85); // the void below fades into mist
  c = mix(c, uFog, fog) + uFlash * vec3(0.9) * (0.3 + 0.7 * fog);
  o = vec4(c, 1.0);
}`);
const SKY = prog(`#version 300 es
in vec2 aP; out vec2 vP; void main() { vP = aP; gl_Position = vec4(aP, 0.999, 1.0); }`,
`#version 300 es
precision highp float;
in vec2 vP; out vec4 o; uniform vec3 uF; uniform vec3 uR; uniform vec3 uU; uniform vec2 uT; uniform float uFlash; uniform float uTime; uniform float uStyle; uniform vec3 uBeam;
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main() {
  vec3 d = normalize(uF + vP.x * uT.x * uR + vP.y * uT.y * uU);
  float y = d.y;
  vec3 top = mix(vec3(0.47, 0.47, 0.5), vec3(0.6, 0.6, 0.62), uStyle), hor = mix(vec3(0.64, 0.64, 0.66), vec3(0.8, 0.8, 0.81), uStyle), low = mix(vec3(0.56, 0.56, 0.58), vec3(0.72, 0.72, 0.74), uStyle);
  vec3 c = y > 0.0 ? mix(hor, top, pow(clamp(y, 0.0, 1.0), 0.7)) : mix(hor, low, clamp(-y * 2.0, 0.0, 1.0));
  // slow drifting mist bands
  float a = atan(d.z, d.x);
  float cl = sin(a * 5.0 + uTime * 0.04 + y * 4.0) * sin(a * 11.0 - uTime * 0.025 + y * 7.0) * 0.5 + 0.5;
  c += vec3(0.05) * cl * smoothstep(-0.3, 0.3, y) * smoothstep(0.8, 0.2, y);
  if (uStyle > 1.5) { c = mix(vec3(0.0), vec3(0.16, 0.02, 0.2), smoothstep(0.35, -0.05, y) * 0.6); } // the rest room: a black sky
  else if (uStyle > 0.5) {
    // light beams fanning up from a bright spot on the horizon
    vec3 b = normalize(uBeam); float cb = dot(d, b); vec3 q = d - b * cb;
    vec3 bu = normalize(vec3(0.0, 1.0, 0.0) - b * b.y), br = cross(b, bu);
    float ang = atan(dot(q, br), dot(q, bu));
    float rays = pow(abs(sin(ang * 9.0 + sin(ang * 23.0) * 0.6)), 6.0) * 0.8 + pow(abs(sin(ang * 4.0 + 1.3)), 10.0);
    float fan = smoothstep(1.25, 0.15, abs(ang));
    c += vec3(1.0) * rays * fan * smoothstep(0.0, 0.92, cb) * 0.32 * smoothstep(-0.04, 0.04, y);
    c += vec3(1.0) * pow(max(cb, 0.0), 80.0) * 0.7;
    // white wisps drifting across the sky
    float w1 = sin(d.x * 6.0 + sin(d.z * 4.0 + uTime * 0.03) * 1.8 + y * 14.0 + uTime * 0.02);
    float w2 = sin(d.z * 7.0 - sin(d.x * 3.0 - uTime * 0.025) * 2.2 + y * 11.0);
    float wisp = smoothstep(0.93, 1.0, w1) * smoothstep(0.04, 0.22, y) * smoothstep(0.9, 0.4, y) + smoothstep(0.95, 1.0, w2) * smoothstep(0.1, 0.35, y) * 0.7;
    c += vec3(0.2) * wisp;
  }
  c += uFlash * vec3(0.35) * (0.5 + 0.5 * smoothstep(-0.1, 0.5, y));
  o = vec4(c, 1.0);
}`);
const SHADOW = prog(`#version 300 es
in vec3 aPos; uniform mat4 uL; void main() { gl_Position = uL * vec4(aPos, 1.0); }`, `#version 300 es
precision highp float; out vec4 o; void main() { o = vec4(1.0); }`);
const GLOW = prog(`#version 300 es
in vec3 aPos; in vec4 aCol; uniform mat4 uVP; out vec4 vCol;
void main() { vCol = aCol; gl_Position = uVP * vec4(aPos, 1.0); }`,
`#version 300 es
precision highp float; in vec4 vCol; out vec4 o; void main() { o = vCol; }`);

// ---------- the course ----------
const boxes = [], ramps = [], verts = [];
const quad = (a, b, c, d, n, col) => { for (const p of [a, b, c, a, c, d]) verts.push(p[0], p[1], p[2], n[0], n[1], n[2], col[0], col[1], col[2]); };
const shade = (col, k) => [col[0] * k, col[1] * k, col[2] * k];
function box(x0, y0, z0, x1, y1, z1, col, kind) {
