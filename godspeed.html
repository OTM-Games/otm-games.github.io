<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godspeed</title>
<style>
:root { --fg: #f3f0ff; --dim: #a79fc4; --bolt: #bfe4ff; --gold: #ffd76a; --line: #3b3060; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #0b0820; color: var(--fg); font: 15px system-ui, sans-serif; overflow: hidden; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, rgba(70, 50, 140, 0.55), rgba(8, 6, 22, 0.94) 70%); z-index: 3; }
.screen h1 { margin: 0; font: 900 clamp(48px, 11vw, 120px) / 0.9 system-ui, sans-serif; letter-spacing: -0.04em; font-style: italic; background: linear-gradient(180deg, #fff 30%, var(--bolt)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px rgba(150, 200, 255, 0.55)); }
.screen .sub { font: 700 14px ui-monospace, Menlo, monospace; letter-spacing: 0.5em; color: var(--dim); text-transform: uppercase; margin-top: -6px; }
.screen button { font: 800 17px system-ui, sans-serif; padding: 13px 26px; border-radius: 12px; border: 0; background: var(--fg); color: #0b0820; cursor: pointer; min-width: 220px; }
.screen button.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.keys { display: grid; grid-template-columns: auto auto; gap: 6px 18px; text-align: left; color: var(--dim); font-size: 14px; margin: 6px 0; }
.keys b { color: var(--fg); font: 700 13px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; display: inline-block; min-width: 26px; text-align: center; }
.best { color: var(--gold); font: 700 15px ui-monospace, Menlo, monospace; }
.row { display: flex; gap: 10px; align-items: center; color: var(--dim); }
.row input { accent-color: var(--bolt); width: 180px; }
.big { font: 900 clamp(40px, 8vw, 80px) ui-monospace, Menlo, monospace; color: #fff; }
.err { color: #ff8a9a; max-width: 420px; }
.binds { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 10px; align-items: center; text-align: left; width: min(520px, 100%); }
.binds span { color: var(--dim); font-size: 14px; }
.binds button { min-width: 0; padding: 8px 10px; font: 700 13px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.08); color: var(--fg); border: 1.5px solid var(--line); border-radius: 8px; }
.binds button.wait { background: var(--bolt); color: #0b0820; border-color: var(--bolt); }
.binds button.clash { border-color: #ff8a9a; }
.screen .small { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div class="screen" id="title">
  <h1>GODSPEED</h1>
  <div class="sub">full note</div>
  <div class="best" id="bestT"></div>
  <button id="play">▶ Play</button>
  <button class="ghost" id="bindsBtn">⌨ Keybinds</button>
  <div class="keys" id="keyList"></div>
  <div class="sub" style="letter-spacing:.15em;font-size:12px">slide → jump keeps your momentum</div>
  <div class="err" id="err"></div>
</div>

<div class="screen" id="pause" hidden>
  <h1 style="font-size:64px">PAUSED</h1>
  <button id="resume">▶ Resume</button>
  <button class="ghost" id="restart">↺ Restart run</button>
  <label class="row">mouse speed <input type="range" id="sens" min="0.3" max="3" step="0.05"></label>
  <label class="row">volume <input type="range" id="vol" min="0" max="1" step="0.05"></label>
  <label class="row">field of view <input type="range" id="fov" min="70" max="110" step="1"></label>
  <button class="ghost" id="bindsBtn2">⌨ Keybinds</button>
</div>

<div class="screen" id="bindsScreen" hidden>
  <h1 style="font-size:56px">KEYBINDS</h1>
  <div class="small">click a box, then press a key or mouse button · Esc cancels · Backspace clears</div>
  <div class="binds" id="bindList"></div>
  <div class="row"><button class="ghost" id="bindsReset" style="min-width:0">↺ Defaults</button><button id="bindsDone" style="min-width:0">✓ Done</button></div>
</div>

<div class="screen" id="done" hidden>
  <div class="sub">course complete</div>
  <div class="big" id="doneT"></div>
  <div class="best" id="doneB"></div>
  <button id="again">↺ Run it again</button>
</div>

<script>
(() => {
'use strict';
// ===================== GODSPEED =====================
// A movement game: run, slide, jump and dash on lightning to the end of the course as fast as you can.
const $ = (id) => document.getElementById(id);
const glc = $('gl'), hud = $('hud'), hx = hud.getContext('2d');
const gl = glc.getContext('webgl2', { antialias: true });
if (!gl) { $('err').textContent = "Your browser can't run 3D games (WebGL2 is off). Try Chrome or Edge."; $('play').hidden = true; return; }
const store = { get(k, d) { try { const v = localStorage.getItem('godspeed-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('godspeed-' + k, JSON.stringify(v)); } catch (e) {} } };
const settings = Object.assign({ sens: 1, vol: 0.7, fov: 90 }, store.get('settings', {}));
// keybinds: each action has two slots. Mouse buttons are 'Mouse0' (left), 'Mouse1' (middle), 'Mouse2' (right)
const ACTIONS = [
  ['forward', 'run forward (you speed up the longer you run)'], ['back', 'back'], ['left', 'left'], ['right', 'right'],
  ['jump', 'jump'], ['slide', 'slide: keeps your speed, faster downhill'], ['dash', '⚡ lightning dash where you look (1 per jump)'], ['reset', 'back to the last checkpoint'],
];
const DEFAULT_BINDS = { forward: ['KeyW', 'ArrowUp'], back: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['Space', ''], slide: ['KeyC', 'ControlLeft'], dash: ['KeyE', 'Mouse2'], reset: ['KeyR', ''] };
const binds = JSON.parse(JSON.stringify(DEFAULT_BINDS));
{ const saved = store.get('binds', null); if (saved) for (const [a] of ACTIONS) if (Array.isArray(saved[a])) binds[a] = [saved[a][0] || '', saved[a][1] || '']; }
const keyName = (c) => !c ? '—' : c === 'Mouse0' ? 'LMB' : c === 'Mouse1' ? 'MMB' : c === 'Mouse2' ? 'RMB' : c === 'Space' ? 'Space' : c.startsWith('Key') ? c.slice(3) : c.startsWith('Digit') ? c.slice(5) : c.startsWith('Arrow') ? { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→' }[c] : c.replace('Left', ' L').replace('Right', ' R').replace('Control', 'Ctrl');
const actionOf = (code) => { for (const [a] of ACTIONS) if (binds[a].includes(code)) return a; return null; };
let W = 0, H = 0, DPR = 1;
function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; glc.width = W * DPR; glc.height = H * DPR; hud.width = W * DPR; hud.height = H * DPR; hx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', size); size();

// ---------- tiny math ----------
const V = { add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], len: (a) => Math.hypot(a[0], a[1], a[2]), norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; } };
function perspective(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f); return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]; }
function viewMat(eye, f, u, r) { return [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -V.dot(r, eye), -V.dot(u, eye), V.dot(f, eye), 1]; }
function mmul(a, b) { const o = new Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }

// ---------- shaders ----------
function prog(vs, fs) {
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const WORLD = prog(`#version 300 es
in vec3 aPos; in vec3 aNor; in vec3 aCol;
uniform mat4 uVP; out vec3 vPos; out vec3 vNor; out vec3 vCol;
void main() { vPos = aPos; vNor = aNor; vCol = aCol; gl_Position = uVP * vec4(aPos, 1.0); }`,
`#version 300 es
precision highp float;
in vec3 vPos; in vec3 vNor; in vec3 vCol; out vec4 o;
uniform vec3 uCam; uniform vec3 uFog; uniform float uFlash; uniform vec3 uBolt; uniform float uBoltT;
void main() {
  vec3 n = normalize(vNor), sun = normalize(vec3(0.35, 0.85, 0.4));
  float d = max(dot(n, sun), 0.0) * 0.62 + 0.38 + max(dot(n, vec3(-0.5, 0.2, -0.6)), 0.0) * 0.12;
  // a faint grid on every face, so you can feel your speed
  vec3 q = vPos * 0.5, w = fwidth(q) * 1.2, g = smoothstep(w, vec3(0.0), abs(fract(q) - 0.5) - 0.5 + w);
  vec3 an = abs(n); float line = max(max(g.x * (1.0 - an.x), g.y * (1.0 - an.y)), g.z * (1.0 - an.z));
  vec3 c = vCol * d * (1.0 - 0.22 * line);
  // the last lightning dash lights up what's near it
  float bl = uBoltT * 6.0 / (1.0 + dot(vPos - uBolt, vPos - uBolt) * 0.15);
  c += vec3(0.55, 0.75, 1.0) * bl;
  float dist = length(vPos - uCam), fog = 1.0 - exp(-dist * 0.011);
  c = mix(c, uFog, fog) + uFlash * vec3(0.5, 0.55, 0.9) * (0.4 + 0.6 * fog);
  o = vec4(c, 1.0);
}`);
const SKY = prog(`#version 300 es
in vec2 aP; out vec2 vP; void main() { vP = aP; gl_Position = vec4(aP, 0.999, 1.0); }`,
`#version 300 es
precision highp float;
in vec2 vP; out vec4 o; uniform vec3 uF; uniform vec3 uR; uniform vec3 uU; uniform vec2 uT; uniform float uFlash; uniform float uTime;
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main() {
  vec3 d = normalize(uF + vP.x * uT.x * uR + vP.y * uT.y * uU);
  float y = d.y;
  vec3 top = vec3(0.03, 0.02, 0.10), hor = vec3(0.24, 0.17, 0.42), low = vec3(0.05, 0.03, 0.12);
  vec3 c = y > 0.0 ? mix(hor, top, pow(clamp(y, 0.0, 1.0), 0.6)) : mix(hor, low, clamp(-y * 3.0, 0.0, 1.0));
  // storm clouds: soft bands that drift
  float a = atan(d.z, d.x);
  float cl = sin(a * 7.0 + uTime * 0.05) * sin(a * 13.0 - uTime * 0.03 + y * 9.0) * 0.5 + 0.5;
  c += vec3(0.10, 0.08, 0.20) * cl * smoothstep(0.05, 0.4, y) * smoothstep(0.9, 0.3, y);
  // stars through the gaps
  vec2 sp = vec2(a * 260.0, y * 260.0); vec2 cell = fract(sp) - 0.5; float st = step(0.995, h(floor(sp))) * smoothstep(0.25, 0.05, length(cell)) * smoothstep(0.2, 0.6, y) * (1.0 - cl);
  c += vec3(st);
  c += uFlash * vec3(0.55, 0.6, 1.0) * (0.5 + 0.5 * smoothstep(-0.1, 0.5, y));
  o = vec4(c, 1.0);
}`);
const GLOW = prog(`#version 300 es
in vec3 aPos; in vec4 aCol; uniform mat4 uVP; out vec4 vCol;
void main() { vCol = aCol; gl_Position = uVP * vec4(aPos, 1.0); }`,
`#version 300 es
precision highp float; in vec4 vCol; out vec4 o; void main() { o = vCol; }`);

// ---------- the course ----------
const boxes = [], ramps = [], verts = [];
const quad = (a, b, c, d, n, col) => { for (const p of [a, b, c, a, c, d]) verts.push(p[0], p[1], p[2], n[0], n[1], n[2], col[0], col[1], col[2]); };
const shade = (col, k) => [col[0] * k, col[1] * k, col[2] * k];
function box(x0, y0, z0, x1, y1, z1, col, kind) {
  boxes.push({ x0, y0, z0, x1, y1, z1, kind: kind || 'solid' });
  const top = col, side = shade(col, 0.82);
  quad([x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [0, 1, 0], top);
  quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0], shade(col, 0.5));
  quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], side);
  quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [0, 0, -1], side);
  quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [1, 0, 0], side);
  quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [-1, 0, 0], side);
}
function ramp(x0, x1, z0, z1, ya, yb, col) { // a slope along z: height ya at z0, yb at z1
  const n = V.norm([0, z1 - z0, -(yb - ya)]);
  ramps.push({ x0, x1, z0, z1, ya, yb, n });
  const lo = Math.min(ya, yb) - 1;
  quad([x0, ya, z0], [x0, yb, z1], [x1, yb, z1], [x1, ya, z0], n, col);
  quad([x0, lo, z0], [x1, lo, z0], [x1, lo, z1], [x0, lo, z1], [0, -1, 0], shade(col, 0.5));
  quad([x1, lo, z0], [x1, lo, z1], [x1, yb, z1], [x1, ya, z0], [1, 0, 0], shade(col, 0.8));
  quad([x0, lo, z1], [x0, lo, z0], [x0, ya, z0], [x0, yb, z1], [-1, 0, 0], shade(col, 0.8));
}
const STONE = [0.80, 0.78, 0.88], STONE2 = [0.66, 0.63, 0.78], GOLD = [0.98, 0.78, 0.36], DARK = [0.38, 0.33, 0.52], RED = [0.85, 0.32, 0.38];
const checkpoints = [], orbs = [], hints = [];
const K = (a) => binds[a].filter(Boolean).map(keyName).join(' or ') || '(no key set)';
let finishZ = 0, finishY = 0;
function buildCourse() {
  // 1. the runway
  box(-4, -1, -6, 4, 0, 20, STONE);
  hints.push({ z: -6, get text() { return `${[binds.forward[0], binds.left[0], binds.back[0], binds.right[0]].map(keyName).join('')} to run. The longer you run, the faster you go`; } });
  hints.push({ z: 14, get text() { return `${K('jump').toUpperCase()}: jump the gap`; } });
  // 2. jump a gap, then slide under the bar
  box(-4, -1, 25, 4, 0, 46, STONE);
  box(-4.5, 1.15, 37, 4.5, 2.6, 39, RED); // low bar: you have to slide under it
  box(-4.6, -1, 25, -4, 3, 46, DARK); box(4, -1, 25, 4.6, 3, 46, DARK); // side walls
  hints.push({ z: 30, get text() { return `${K('slide').toUpperCase()}: slide under the bar`; } });
  checkpoints.push({ x: 0, y: 0, z: 43 });
  // 3. slide down the big ramp to pick up speed
  ramp(-4, 4, 46, 72, 0, -11, STONE2);
  hints.push({ z: 47, text: 'Slide down the ramp. Sliding downhill makes you faster' });
  box(-4, -12, 72, 4, -11, 84, STONE);
  hints.push({ z: 77, text: 'Slide, then jump while sliding: you keep all that speed' });
  // 4. a wide gap: slide-jump it
  box(-4, -12, 93, 4, -11, 112, STONE);
  // 5. climb the up-ramp
  ramp(-4, 4, 112, 128, -11, -5, STONE2);
  box(-4, -6, 128, 4, -5, 138, STONE);
  checkpoints.push({ x: 0, y: -5, z: 131 });
  hints.push({ z: 129, get text() { return `${K('dash').toUpperCase()}: ⚡ lightning dash where you look`; } });
  // 6. huge gap with a lightning orb: jump, dash, grab the orb, dash again
  orbs.push({ x: 0, y: -3, z: 152 });
  box(-4, -6, 166, 4, -5, 180, STONE);
  hints.push({ z: 140, text: 'Jump, dash, touch the ⚡ orb to get your dash back, dash again' });
  checkpoints.push({ x: 0, y: -5, z: 170 });
  // 7. a tall wall: look up and dash over
  box(-6, -6, 180, 6, 0.2, 182, DARK);
  hints.push({ z: 172, text: 'Jump, look up, and dash over the wall' });
  box(-4, -6, 182, 4, -5, 200, STONE);
  // 8. zig-zag platforms over the void
  box(1, -6, 205, 11, -5, 215, STONE);
  box(-5, -6, 220, 5, -5, 230, STONE);
  box(-11, -6, 235, -1, -5, 245, STONE);
  checkpoints.push({ x: -6, y: -5, z: 240 });
  hints.push({ z: 201, get text() { return `Zig-zag! Steer in the air with ${keyName(binds.left[0])} and ${keyName(binds.right[0])}`; } });
  // 9. the long fall slide to the finish
  ramp(-11, -1, 245, 274, -5, -20, STONE2);
  box(-11, -21, 274, -1, -20, 288, STONE);
  box(-12, -21, 299, 12, -20, 324, STONE);
  orbs.push({ x: -3, y: -17, z: 293 });
  hints.push({ z: 248, text: 'Last one. Slide, jump, dash. GODSPEED' });
  // finish gate
  box(-6, -20, 312, -4.5, -11, 313.5, GOLD); box(4.5, -20, 312, 6, -11, 313.5, GOLD); box(-6, -12, 312, 6, -11, 313.5, GOLD);
  boxes.splice(boxes.length - 3, 3); // the gate is just decoration
  finishZ = 312.7; finishY = -20;
  // pillars falling away into the storm below, for scale
  let s = 7;
  const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 70; i++) { const side = r() < 0.5 ? -1 : 1, x = side * (18 + r() * 60), z = -20 + r() * 360, w = 2 + r() * 5, top = -14 + r() * 26; const c = 0.32 + r() * 0.2; box(x - w, -90, z - w, x + w, top, z + w, [c, c * 0.92, c * 1.3]); boxes.pop(); }
}
buildCourse();
const START = { x: 0, y: 0, z: -2 };
hints.sort((a, b) => a.z - b.z);

const worldBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, worldBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
const worldVAO = gl.createVertexArray(); gl.bindVertexArray(worldVAO);
for (const [name, off] of [['aPos', 0], ['aNor', 3], ['aCol', 6]]) { const l = gl.getAttribLocation(WORLD.p, name); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 36, off * 4); }
const worldCount = verts.length / 9;
const skyVAO = gl.createVertexArray(); gl.bindVertexArray(skyVAO);
const skyBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
{ const l = gl.getAttribLocation(SKY.p, 'aP'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 8, 0); }
const glowVAO = gl.createVertexArray(); gl.bindVertexArray(glowVAO);
const glowBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, glowBuf);
{ const a = gl.getAttribLocation(GLOW.p, 'aPos'), c = gl.getAttribLocation(GLOW.p, 'aCol'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 3, gl.FLOAT, false, 28, 0); gl.enableVertexAttribArray(c); gl.vertexAttribPointer(c, 4, gl.FLOAT, false, 28, 12); }

// ---------- sound (all made in code) ----------
let AC = null, master = null, wind = null, slideN = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = settings.vol; master.connect(AC.destination);
  const noise = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const loop = (freq, q) => { const s = AC.createBufferSource(); s.buffer = noise; s.loop = true; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; const g = AC.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(master); s.start(); return { g, f }; };
  wind = loop(500, 0.6); slideN = loop(1800, 1.2);
  audio.noise = noise;
}
function sfx(kind) {
  if (!AC) return;
