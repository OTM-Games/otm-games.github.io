<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTM Stickmen Online</title>
<style>html, body { margin: 0; height: 100%; background: #e2e8f0; font-family: system-ui, sans-serif; } #again { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; } #again button { font: 800 20px system-ui, sans-serif; padding: 14px 22px; border-radius: 14px; border: none; background: #2563eb; color: white; cursor: pointer; }</style>
</head>
<body>
<div id="again"><button type="button" onclick="location.reload()">▶ Play OTM Stickmen Online again</button></div>
<script>
// OTM STICKMEN — by Teigen (liquid blood, play/watch modes, 1v1 duels, stage builder).
// Paste this whole thing into the Chrome dev console (F12 → Console) on any page and press Enter.
// Spawn fighters with the buttons, drag and throw them with the mouse. Esc (or the Quit button) closes it.
(() => {
window.stickman?.quit?.(); // close any copy that's already running
document.getElementById('stickman-engine')?.remove();

// ---------- Build the screen (no document.write, no outside files) ----------
const root = document.createElement('div');
root.id = 'stickman-engine';
Object.assign(root.style, {
position: 'fixed', inset: '0', zIndex: '2147483647', overflow: 'hidden',
background: 'radial-gradient(circle at 50% 50%, #f8fafc, #cbd5e1)',
fontFamily: 'Inter, system-ui, sans-serif',
});
// ---------- Font: hand-drawn 3D block letters ----------
const SKETCH_FONT = "'Rubik Doodle Shadow', 'Comic Sans MS', system-ui, sans-serif";
const PLAIN_FONT = 'Inter, system-ui, sans-serif';
let sketchFont = true;
const uiFont = () => (sketchFont ? SKETCH_FONT : PLAIN_FONT);
if (!document.getElementById('otm-font')) {
const fontLink = document.createElement('link');
fontLink.id = 'otm-font'; fontLink.rel = 'stylesheet';
fontLink.href = 'https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&display=swap';
(document.head || document.documentElement || document.body).appendChild(fontLink);
}
const fontStyle = document.createElement('style');
const applyFont = () => { fontStyle.textContent = `#stickman-engine, #stickman-engine * { font-family: ${uiFont()} !important; }`; };
applyFont();
root.appendChild(fontStyle);
try { document.fonts && document.fonts.load("24px 'Rubik Doodle Shadow'"); } catch (e) {}

const canvas = document.createElement('canvas');
Object.assign(canvas.style, { display: 'block', width: '100%', height: '100%' });
root.appendChild(canvas);

const el = (tag, style, text) => {
const e = document.createElement(tag);
Object.assign(e.style, style);
if (text) e.textContent = text;
return e;
};

const panel = el('div', {
position: 'absolute', top: '24px', right: '24px', width: '260px', padding: '20px',
borderRadius: '16px', background: 'rgba(255,255,255,0.85)', backdropFilter: 'blur(12px)',
border: '1px solid rgba(255,255,255,0.6)', boxShadow: '0 20px 40px -10px rgba(0,0,0,0.15)',
});
const head = el('div', { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' });
head.appendChild(el('div', { fontSize: '20px', fontWeight: '800', color: '#1e293b' }, 'OTM Stickmen'));
head.appendChild(el('span', { padding: '2px 8px', background: '#dbeafe', color: '#1d4ed8', fontSize: '12px', fontWeight: '700', borderRadius: '999px' }, 'v12.2 • online'));
const hideBtn = el('button', { marginLeft: '8px', width: '28px', height: '28px', border: 'none', borderRadius: '8px', background: '#e2e8f0', color: '#334155', fontWeight: '900', fontSize: '15px', cursor: 'pointer', lineHeight: '1' }, '–');
hideBtn.title = 'Hide the spawn menu';
head.appendChild(hideBtn);
panel.appendChild(head);
let panelHidden = false;
hideBtn.onclick = () => {
panelHidden = !panelHidden;
for (const c of [...panel.children]) if (c !== head) c.style.display = panelHidden ? 'none' : '';
panel.style.width = panelHidden ? 'auto' : '260px';
panel.style.padding = panelHidden ? '10px 14px' : '20px';
head.style.marginBottom = panelHidden ? '0' : '4px';
hideBtn.textContent = panelHidden ? '+' : '–';
hideBtn.title = panelHidden ? 'Show the spawn menu' : 'Hide the spawn menu';
};
panel.appendChild(el('div', { fontSize: '12px', color: '#64748b', marginBottom: '16px' }, 'Play or Watch • Physics • Liquid Blood'));

const button = (label, bg, color = 'white') => {
const b = el('button', {
display: 'block', width: '100%', marginBottom: '10px', padding: '10px 14px', border: 'none',
borderRadius: '12px', background: bg, color, fontWeight: '700', fontSize: '14px',
cursor: 'pointer', textAlign: 'left', boxShadow: '0 4px 6px rgba(0,0,0,0.1)',
}, label);
panel.appendChild(b);
return b;
};
const btnBrawler = button('🥊 Spawn Brawler', 'linear-gradient(to right, #ef4444, #e11d48)');
const btnNinja = button('⚔️ Spawn Ninja', 'linear-gradient(to right, #10b981, #22c55e)');
const btnMonk = button('🦯 Spawn Monk', 'linear-gradient(to right, #f59e0b, #eab308)');
const btnGun = button('🤠 Spawn Gunslinger', 'linear-gradient(to right, #92400e, #ca8a04)');
const btnWillie = button('🚢 Spawn Steamboat Willie', 'linear-gradient(to right, #525252, #0a0a0a)');
const btnVamp = button('🦇 Spawn Vampire', 'linear-gradient(to right, #991b1b, #0a0a0a)');
const btnChrono = button('⏳ Spawn Chronarch', 'linear-gradient(to right, #b91c1c, #6b21a8)');
const btnRemove = button('🚫 Remove Characters', '#e2e8f0', '#334155');
const btnClear = button('🧹 Clear Bodies & Gore', '#e2e8f0', '#334155');
const btnQuit = button('✖ Quit (Esc)', '#e2e8f0', '#334155');
panel.appendChild(el('div', { fontSize: '12px', color: '#64748b', textAlign: 'center' }, 'Click a body part to hit it • Drag to throw • ⚙️ settings and 🧱 Stage Builder top left • Ctrl+Shift+Z raises the dead 🧟'));
root.appendChild(panel);

// ---------- Difficulty (only changes enemies in play mode; Watch mode stays the same) ----------
// dmg = how hard enemies hit you, attack = how often they swing, dodge = how often they dodge,
// gunRate/spread = how often and how accurately enemy gunslingers shoot, speed = how fast they chase,
// maxAttackers = how many enemies can attack you at the same time
const DIFFICULTY = {
easy: { label: '😊 Easy', short: 'Easy', color: '#16a34a', desc: 'Slow enemies, soft hits, one attacks at a time.', dmg: 0.4, attack: 0.05, dodge: 0.25, gunRate: 0.35, spread: 2.2, speed: 0.6, maxAttackers: 1, playerHP: 220, finisher: 0.3, wave: (n) => Math.min(3, Math.ceil(n / 2)) },
normal: { label: '🙂 Normal', short: 'Normal', color: '#2563eb', desc: 'A fair fight. Two can attack at once.', dmg: 0.65, attack: 0.12, dodge: 0.55, gunRate: 0.6, spread: 1.5, speed: 0.8, maxAttackers: 2, playerHP: 170, finisher: 0.55, wave: (n) => Math.min(4, n) },
hard: { label: '😠 Hard', short: 'Hard', color: '#ea580c', desc: 'The old difficulty. Everyone attacks at once.', dmg: 1, attack: 0.35, dodge: 1, gunRate: 1, spread: 1, speed: 1, maxAttackers: 99, playerHP: 150, finisher: 0.75, wave: (n) => Math.min(6, n + 1) },
insane: { label: '💀 Insane', short: 'Insane', color: '#7f1d1d', desc: 'Faster, deadlier, bigger waves. Good luck.', dmg: 1.4, attack: 0.5, dodge: 1.3, gunRate: 1.4, spread: 0.75, speed: 1.15, maxAttackers: 99, playerHP: 120, finisher: 0.9, wave: (n) => Math.min(8, n + 2) },
};
let difficulty = 'normal';
const enemyDiff = (s) => (s && s.team === 'enemy' ? DIFFICULTY[difficulty] : DIFFICULTY.hard); // AI that isn't fighting you plays like before

// ---------- Settings menu (top left) ----------
const glass = { background: 'rgba(255,255,255,0.85)', backdropFilter: 'blur(12px)', border: '1px solid rgba(255,255,255,0.6)', boxShadow: '0 20px 40px -10px rgba(0,0,0,0.15)' };
const gearBtn = el('button', { position: 'absolute', top: '24px', left: '24px', width: '46px', height: '46px', borderRadius: '14px', fontSize: '22px', cursor: 'pointer', ...glass }, '⚙️');
gearBtn.title = 'Settings';
const settings = el('div', { position: 'absolute', top: '80px', left: '24px', width: '260px', padding: '18px', borderRadius: '16px', display: 'none', maxHeight: 'calc(100vh - 110px)', overflowY: 'auto', boxSizing: 'border-box', zIndex: '5', ...glass });
settings.appendChild(el('div', { fontSize: '18px', fontWeight: '800', color: '#1e293b', marginBottom: '14px' }, 'Settings'));

// ---------- Button mapping ----------
// each action is named after its default key; binds[action] = the key that actually does it
const ACTIONS = [['ArrowLeft', '⬅️ Move left'], ['ArrowRight', '➡️ Move right'], ['ArrowUp', '⬆️ Jump'], ['ArrowDown', '⬇️ Down / low'],
['a', '👊 Attack A'], ['s', '👊 Attack S'], ['d', '👊 Attack D'], ['f', '👊 Attack F'],
['Shift', '💨 Dodge'], ['t', '😎 Taunt'], ['r', '🔄 Reload (gunslinger)'], ['h', '📋 Hide controls']];
const KEYS_SAVE = 'otm-stickmen-keys';
let binds = Object.fromEntries(ACTIONS.map(([a]) => [a, a]));
try { const sv = JSON.parse(localStorage.getItem(KEYS_SAVE) || 'null'); if (sv) for (const [a] of ACTIONS) if (typeof sv[a] === 'string') binds[a] = sv[a]; } catch (e) {}
let physToAction = {};
const rebuildBinds = () => { physToAction = {}; for (const a in binds) physToAction[binds[a]] = a; try { localStorage.setItem(KEYS_SAVE, JSON.stringify(binds)); } catch (e) {} };
rebuildBinds();
const keyLabel = (k) => ({ ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ' ': 'Space', Shift: 'Shift', Control: 'Ctrl', Alt: 'Alt', Enter: 'Enter', Tab: 'Tab', Backspace: '⌫', CapsLock: 'Caps' }[k] || (k.length === 1 ? k.toUpperCase() : k));
let rebinding = null; // the action waiting for a new key
// 2-player layout: P1 on the left of the keyboard, P2 on the right
const TWO_P_BINDS = {
'1:ArrowLeft': 'a', '1:ArrowRight': 'd', '1:ArrowUp': 'w', '1:ArrowDown': 's', '1:a': 'c', '1:s': 'v', '1:d': 'b', '1:f': 'n', '1:Shift': 'q', '1:t': 'e', '1:r': 'r',
'2:ArrowLeft': 'ArrowLeft', '2:ArrowRight': 'ArrowRight', '2:ArrowUp': 'ArrowUp', '2:ArrowDown': 'ArrowDown', '2:a': 'k', '2:s': 'l', '2:d': ';', '2:f': "'", '2:Shift': 'Enter', '2:t': 'p', '2:r': 'o',
};
const physToAction2 = {};
for (const a in TWO_P_BINDS) physToAction2[TWO_P_BINDS[a]] = a;
let twoP = false; // true while 2 people are playing on one keyboard

const bloodLabel = el('div', { fontSize: '13px', fontWeight: '700', color: '#334155', marginBottom: '6px' }, '🩸 Blood amount: x1');
const bloodSlider = el('input', { width: '100%', marginBottom: '4px', accentColor: '#b91c1c', cursor: 'pointer' });
Object.assign(bloodSlider, { type: 'range', min: '0', max: '3', step: '0.5', value: '1' });
const ticks = el('div', { display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#94a3b8', marginBottom: '16px' });
for (const t of ['Off', '', 'x1', '', 'x2', '', 'x3']) ticks.appendChild(el('span', {}, t || '·'));

const bgRow = el('label', { display: 'flex', alignItems: 'center', gap: '10px', fontSize: '13px', fontWeight: '700', color: '#334155', cursor: 'pointer' });
const bgCheck = el('input', { width: '18px', height: '18px', accentColor: '#10b981', cursor: 'pointer', margin: '0' });
Object.assign(bgCheck, { type: 'checkbox', checked: true });
bgRow.appendChild(bgCheck);
bgRow.appendChild(el('span', {}, '🖼️ Show background'));
const bgHint = el('div', { fontSize: '11px', color: '#64748b', marginTop: '6px' }, 'Turn off to fight on top of the website.');

const menuBtn = el('button', { display: 'block', width: '100%', marginTop: '16px', padding: '10px', border: 'none', borderRadius: '12px', background: '#e2e8f0', color: '#334155', fontWeight: '700', fontSize: '14px', cursor: 'pointer' }, '🏠 Main menu (Play / Watch)');
menuBtn.onclick = () => toMainMenu();
const diffLabel = el('div', { fontSize: '13px', fontWeight: '700', color: '#334155', margin: '16px 0 6px' }, '🎯 Difficulty (play mode)');
const diffRow = el('div', { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '4px' });
const diffBtns = {};
for (const key of Object.keys(DIFFICULTY)) {
const b = el('button', { padding: '7px 0', border: 'none', borderRadius: '8px', fontSize: '11px', fontWeight: '800', cursor: 'pointer' }, DIFFICULTY[key].short);
b.onclick = () => setDifficulty(key);
diffBtns[key] = b; diffRow.appendChild(b);
}
function setDifficulty(key) {
difficulty = key;
for (const k in diffBtns) { diffBtns[k].style.background = k === key ? DIFFICULTY[k].color : '#e2e8f0'; diffBtns[k].style.color = k === key ? 'white' : '#334155'; }
}
setDifficulty('normal');
const fontRow = el('label', { display: 'flex', alignItems: 'center', gap: '10px', fontSize: '13px', fontWeight: '700', color: '#334155', cursor: 'pointer', marginTop: '14px' });
const fontCheck = el('input', { width: '18px', height: '18px', accentColor: '#2563eb', cursor: 'pointer', margin: '0' });
Object.assign(fontCheck, { type: 'checkbox', checked: true });
fontRow.appendChild(fontCheck);
fontRow.appendChild(el('span', {}, '✏️ Sketch font'));
fontCheck.onchange = () => { sketchFont = fontCheck.checked; applyFont(); };
const keysLabel = el('div', { fontSize: '13px', fontWeight: '700', color: '#334155', margin: '16px 0 4px' }, '🎮 Button mapping (play mode)');
const keysHint = el('div', { fontSize: '11px', color: '#64748b', marginBottom: '6px' }, 'Click a button, then press the new key. Esc cancels.');
const keysList = el('div', { display: 'flex', flexDirection: 'column', gap: '3px' });
const bindBtns = {};
for (const [a, label] of ACTIONS) {
const row = el('div', { display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '12px', color: '#334155', fontWeight: '600' });
row.appendChild(el('span', {}, label));
const b = el('button', { minWidth: '64px', padding: '4px 8px', border: '2px solid #cbd5e1', borderRadius: '8px', background: 'white', fontSize: '12px', fontWeight: '800', color: '#0f172a', cursor: 'pointer', fontFamily: 'inherit' });
b.onclick = () => { rebinding = rebinding === a ? null : a; refreshBinds(); };
bindBtns[a] = b; row.appendChild(b); keysList.appendChild(row);
}
function refreshBinds() {
for (const [a] of ACTIONS) {
const b = bindBtns[a], wait = rebinding === a;
b.textContent = wait ? 'Press a key…' : keyLabel(binds[a]);
b.style.borderColor = wait ? '#2563eb' : binds[a] !== a ? '#a855f7' : '#cbd5e1'; // purple = changed from the default
b.style.background = wait ? '#dbeafe' : 'white';
}
if (typeof player !== 'undefined' && player && mode === 'play') showControls(player.role);
}
const resetKeysBtn = el('button', { display: 'block', width: '100%', marginTop: '8px', padding: '7px', border: 'none', borderRadius: '10px', background: '#e2e8f0', color: '#334155', fontWeight: '700', fontSize: '12px', cursor: 'pointer', fontFamily: 'inherit' }, '↩️ Reset to default keys');
resetKeysBtn.onclick = () => { binds = Object.fromEntries(ACTIONS.map(([a]) => [a, a])); rebinding = null; rebuildBinds(); refreshBinds(); showToast('Keys reset'); };
settings.append(bloodLabel, bloodSlider, ticks, bgRow, bgHint, fontRow, diffLabel, diffRow, keysLabel, keysHint, keysList, resetKeysBtn, menuBtn);
root.appendChild(gearBtn);
root.appendChild(settings);

gearBtn.onclick = () => { rebinding = null; refreshBinds(); settings.style.display = settings.style.display === 'none' ? 'block' : 'none'; if (settings.style.display === 'block') setBuilder(false); };

// ================= STAGE BUILDER =================
let stage = []; // everything placed with the Stage Builder
const SOLID = new Set(['cube', 'platform', 'pillar', 'ramp', 'ghost']); // things you can stand on
const ITEMS = {
cube: { name: 'Cube', icon: '🟫', w: 70, h: 70 },
platform: { name: 'Platform', icon: '➖', w: 180, h: 18 },
ghost: { name: 'Invisible', icon: '👻', w: 180, h: 18 },
pillar: { name: 'Pillar', icon: '🏛️', w: 50, h: 200 },
ramp: { name: 'Ramp', icon: '📐', w: 150, h: 80 },
bounce: { name: 'Bounce Pad', icon: '🟢', w: 80, h: 16, ground: true },
lava: { name: 'Lava', icon: '🌋', w: 170, h: 22, danger: true, ground: true },
spikes: { name: 'Spikes', icon: '🔺', w: 120, h: 28, danger: true, ground: true },
saw: { name: 'Saw Blade', icon: '🪚', w: 70, h: 70, danger: true },
mine: { name: 'Land Mine', icon: '💣', w: 32, h: 12, danger: true, ground: true },
crusher: { name: 'Crusher', icon: '🔨', w: 90, h: 70, danger: true },
laser: { name: 'Laser', icon: '🔴', w: 26, h: 22, danger: true },
};
const builder = { snap: 10, sel: null, resize: null, hidden: false, open: false, selected: 'cube', tool: 'place', size: 1, flip: false, drag: null, handled: false, painting: null };
let noFloor = false; // true = custom stage with no built-in floor (fall off the bottom and you're out)
const VOID = 1e9; // "no ground down there"
// blocks sorted into 64px-wide columns so lots of blocks stay fast
let stageVer = 0, idxVer = -1, cols = new Map();
const NONE = [];
function solidsNear(x) {
if (idxVer !== stageVer) {
cols = new Map();
for (const b of stage) if (SOLID.has(b.type)) {
for (let c = Math.floor((b.x - 8) / 64); c <= Math.floor((b.x + b.w + 8) / 64); c++) { if (!cols.has(c)) cols.set(c, []); cols.get(c).push(b); }
}
idxVer = stageVer;
}
return cols.get(Math.floor(x / 64)) || NONE;
}
const addItem = (it) => { stage.push(it); stageVer++; };
function removeItem(b) {
const i = stage.indexOf(b);
if (i < 0) return;
stage.splice(i, 1); stageVer++;
if (builder.sel === b) builder.sel = null;
for (let k = 0; k < 10; k++) particles.push({ type: 'smoke', x: b.x + R() * b.w, y: b.y + R() * b.h, r: 4 + R() * 6, vx: (R() - 0.5) * 2, vy: -1 - R(), life: 40 });
}

// height of the top of a solid block at a given x (ramps slope)
function surfaceTop(b, x) {
if (b.type !== 'ramp') return b.y;
const f = Math.max(0, Math.min(1, (x - b.x) / b.w));
return b.y + b.h * (b.flip ? f : 1 - f);
}
// the first thing you'd land on falling straight down from (x, y): a block top or the floor
function surfaceBelow(x, y) {
let best = noFloor ? VOID : height - 70;
for (const b of solidsNear(x)) {
if (x < b.x || x > b.x + b.w) continue;
const t = surfaceTop(b, x);
if (t >= y - 1 && t < best) best = t;
}
return best;
}
// is this point inside a solid block?
function hitSolid(x, y) {
for (const b of solidsNear(x)) {
if (x < b.x || x > b.x + b.w) continue;
if (y >= surfaceTop(b, x) && y <= b.y + b.h) return true;
}
return false;
}
// ----- AI "stage sense": is there a trap at this spot? -----
function trapAt(x, feet, soon = false) {
for (const b of stage) {
switch (b.type) {
case 'lava': case 'spikes': case 'mine':
if (x > b.x - 8 && x < b.x + b.w + 8 && feet > b.y - 14 && feet < b.y + b.h + 14) return b;
break;
case 'saw': {
const r = b.w / 2;
if (Math.hypot(x - (b.x + r), feet - 35 - (b.y + r)) < r + 34) return b;
break;
}
case 'laser': {
const bx = b.x + b.w / 2, on = b.on || (soon && (b.t || 0) % 160 > 130); // on, or about to switch on
if (on && Math.abs(x - bx) < 18 && feet > b.y + b.h && feet - 70 < Math.min(height, surfaceBelow(bx, b.y + b.h))) return b;
break;
}
case 'crusher': {
const danger = b.ph === 'down' || b.ph === 'hold' || (soon && b.ph === 'wait' && b.wait < 30);
if (danger && x > b.x - 12 && x < b.x + b.w + 12 && feet > (b.cy ?? b.y) && feet < Math.min(surfaceBelow(b.x + b.w / 2, b.y + b.h + 1), b.y + b.h + 320) + 4) return b;
break;
}
}
}
return null;
}
// the first trap a fighter would run into in the next ~110px
function trapAhead(x, feet, dir) {
for (let d = 18; d <= 110; d += 14) { const t = trapAt(x + dir * d, feet, true); if (t) return t; }
return null;
}
// is there safe ground to jump to across a gap? returns how fast to jump, or 0
function jumpTarget(x, feet, dir, maxDrop = 90) {
for (let d = 60; d <= 470; d += 20) {
const px = x + dir * d;
if (px < 30 || px > width - 30) break;
const s = surfaceBelow(px, feet - 140);
if (s < height && s >= feet - 120 && s <= feet + maxDrop && !trapAt(px, s)) return Math.min(11, Math.max(3, (d + 30) / (s > feet + 60 ? 60 : 42))); // jumping down = more air time, so less speed
}
return 0;
}

// where a fighter's feet should rest this frame
function groundFor(s) {
const feet = s.y + s.footOff, tol = 12 + Math.abs(s.vx) * 1.2 + Math.max(0, s.vy);
let best = noFloor ? VOID : height - 70;
for (const b of solidsNear(s.x)) {
if (s.x < b.x - 6 || s.x > b.x + b.w + 6) continue;
const t = surfaceTop(b, s.x);
if (feet <= t + tol && t < best) best = t;
}
return best;
}
// build a new item centered on the mouse (ground things snap down onto whatever is below)
function makeItem(type, x, y) {
const d = ITEMS[type], k = builder.size;
const small = ['mine', 'laser'].includes(type) ? Math.min(1.2, k) : k;
const w = Math.round(d.w * small);
const h = ['platform', 'ghost', 'lava', 'bounce'].includes(type) ? d.h : Math.round(d.h * (type === 'spikes' ? Math.min(1.3, k) : small));
const g = builder.snap, sx = Math.round(x / g) * g, sy = Math.round(y / g) * g;
const it = { type, x: sx - w / 2, y: sy - h / 2, w, h, flip: builder.flip, t: 0 };
if (d.ground) { const sb = surfaceBelow(sx, sy - h); it.y = (sb > height ? sy + h / 2 : sb) - h + (type === 'lava' ? 8 : 0); }
return it;
}
function resnap(b) {
if (ITEMS[b.type].ground) { const sb = surfaceBelow(b.x + b.w / 2, b.y); if (sb < height) b.y = sb - b.h + (b.type === 'lava' ? 8 : 0); }
stageVer++;
if (b.type === 'crusher') b.cy = null;
}
function itemAt(x, y) {
for (let i = stage.length - 1; i >= 0; i--) {
const b = stage[i];
if (b.type === 'laser') {
const bx = b.x + b.w / 2;
if (Math.abs(x - bx) < 8 && y > b.y && y < Math.min(height, surfaceBelow(bx, b.y + b.h))) return b;
}

// ---------- Blood on the body ----------
// joint positions of one limb in the fighter's own (local) coordinates
localLimb(part, A = this.anim) {
const L = 22 * (this.stretchK[part] || 1), up = A[part + 'U'], low = A[part + 'L'];
const ox = 0, oy = part.startsWith('arm') ? -40 : 0;
const ex = ox + Math.sin(up) * L, ey = oy + Math.cos(up) * L;
return [ox, oy, ex, ey, ex + Math.sin(up - low) * L, ey + Math.cos(up - low) * L];
}
toLocal(wx, wy) {
const c = Math.cos(this.anim.torso), s = Math.sin(this.anim.torso);
const X = (wx - this.x) * this.dir, Y = wy - this.y;
return [X * c + Y * s, -X * s + Y * c];
}
toWorld(lx, ly) {
const c = Math.cos(this.anim.torso), s = Math.sin(this.anim.torso);
return [this.x + this.dir * (lx * c - ly * s), this.y + (lx * s + ly * c)];
}
// where a stain sits right now (stains move with the limb they're on)
stainLocal(st, A = this.anim) {
if (st.part === 'head') return [A.headX + st.ox, -55 + A.headY + st.oy];
if (st.part === 'torso') return [st.ox, st.oy];
const J = this.localLimb(st.part, A), i = st.seg * 2;
const x1 = J[i], y1 = J[i + 1], dx = J[i + 2] - x1, dy = J[i + 3] - y1, len = Math.hypot(dx, dy) || 1;
return [x1 + dx * st.t - (dy / len) * st.off, y1 + dy * st.t + (dx / len) * st.off];
}
// stick a blood stain to whichever body part is at this world point
stainAt(wx, wy, r) {
if (gore <= 0) return false;
const [lx, ly] = this.toLocal(wx, wy), A = this.anim;
let best = null, bd = 4;
if (this.limbs.head) { const d = Math.hypot(lx - A.headX, ly - (-55 + A.headY)) - 14; if (d < bd) { bd = d; best = { part: 'head' }; } }
const td = distToSeg(lx, ly, 0, 0, 0, -42) - 8;
if (td < bd) { bd = td; best = { part: 'torso' }; }
for (const part of ['armL', 'armR', 'legL', 'legR']) {
if (!this.limbs[part]) continue;
const J = this.localLimb(part);
for (let seg = 0; seg < 2; seg++) {
const i = seg * 2, x1 = J[i], y1 = J[i + 1], dx = J[i + 2] - x1, dy = J[i + 3] - y1, len2 = dx * dx + dy * dy || 1;
const t = Math.max(0, Math.min(1, ((lx - x1) * dx + (ly - y1) * dy) / len2));
const d = Math.hypot(lx - (x1 + t * dx), ly - (y1 + t * dy)) - 5;
if (d < bd) {
bd = d;
const cross = ((lx - x1) * dy - (ly - y1) * dx) / Math.sqrt(len2);
best = { part, seg, t, off: Math.max(-4, Math.min(4, -cross)) };
}
}
}
if (!best) return false;
if (best.part === 'head') {
let ox = lx - A.headX, oy = ly - (-55 + A.headY); const m = Math.hypot(ox, oy);
if (m > 12) { ox *= 12 / m; oy *= 12 / m; }
best.ox = ox; best.oy = oy;
}
if (best.part === 'torso') { best.ox = Math.max(-7, Math.min(7, lx)); best.oy = Math.max(-42, Math.min(0, ly)); }
best.r = Math.min(3.4, 0.8 + r * 0.45); best.age = 0; best.rot = R() * Math.PI; best.shade = R();
best.dots = Array.from({ length: 2 + Math.floor(R() * 3) }, () => ({ dx: (R() - 0.5) * best.r * 3.2, dy: (R() - 0.5) * best.r * 3.2, r: 0.4 + R() * best.r * 0.4 }));

this.stains.push(best);

}

partPath(part, A) {
ctx.beginPath();

const a = Math.atan2(y2 - y1, x2 - x1);
ctx.moveTo(x1 + r1 * Math.cos(a - Math.PI / 2), y1 + r1 * Math.sin(a - Math.PI / 2));
ctx.arc(x1, y1, r1, a - Math.PI / 2, a + Math.PI / 2, true);
ctx.arc(x2, y2, r2, a + Math.PI / 2, a - Math.PI / 2, true);

const len = st.drip * Math.min(1, st.age / 90), w = Math.max(0.7, st.r * 0.42);
ctx.lineWidth = w;
ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * len, y + dy * len); ctx.stroke();
ctx.beginPath(); ctx.arc(x + dx * len, y + dy * len, w * 0.75, 0, Math.PI * 2); ctx.fill();
}
if (st.age < 90) { // wet shine on fresh blood
ctx.globalAlpha = ga * 0.25; ctx.fillStyle = '#ffe4e6';
ctx.beginPath(); ctx.arc(x - st.r * 0.35, y - st.r * 0.3, Math.max(0.4, st.r * 0.22), 0, Math.PI * 2); ctx.fill();
}
}
ctx.restore();
ctx.globalAlpha = ga;
}

// World positions of every body part (used for clicking and for flying limbs)
getParts() {
const A = this.anim, L = 22, c = Math.cos(A.torso), s = Math.sin(A.torso), d = this.dir;
const w = (lx, ly) => [this.x + d * (lx * c - ly * s), this.y + (lx * s + ly * c)];
const limb = (ox, oy, up, low, k = 1) => {
const ex = ox + Math.sin(up) * L * k, ey = oy + Math.cos(up) * L * k;
return [...w(ox, oy), ...w(ex, ey), ...w(ex + Math.sin(up - low) * L * k, ey + Math.cos(up - low) * L * k)];
};
return {
head: w(A.headX, -55 + A.headY), neck: w(0, -44), torso: [...w(0, 0), ...w(0, -42)],
armL: limb(0, -40, A.armLU, A.armLL, this.stretchK.armL), armR: limb(0, -40, A.armRU, A.armRL, this.stretchK.armR),
legL: limb(0, 0, A.legLU, A.legLL, this.stretchK.legL), legR: limb(0, 0, A.legRU, A.legRL, this.stretchK.legR),
};
}

blood(x, y, n, spread = 10, dirX = 0) {
n = Math.round(n * gore);
for (let i = 0; i < n && particles.length < 6000; i++)
particles.push({ type: 'blood', x, y, owner: this, age: 0, color: R() < 0.3 ? DARK_BLOOD : BLOOD, size: 1.5 + R() * 3.5, life: 220, vx: dirX * (2 + R() * 8) + (R() - 0.5) * spread, vy: -R() * spread - 1 });
this.stainAt(x, y, 3 + R() * 3); // the wound itself gets bloody
}

// chunky bits that bounce and splat
gibs(x, y, n, dirX = 0) {
for (let i = 0; i < n; i++)
particles.push({ type: 'gib', x, y, size: 3 + R() * 4, life: 300, vx: dirX * (2 + R() * 7) + (R() - 0.5) * 10, vy: -4 - R() * 9, spin: R() * 6 });
}

// bullet hole on the body
addWound(part) {
if (part === 'torso') this.wounds.push({ part, ox: (R() - 0.5) * 8, oy: -6 - R() * 32 });
else if (part === 'head') this.wounds.push({ part, ox: (R() - 0.5) * 14, oy: (R() - 0.5) * 14 });
if (this.wounds.length > 14) this.wounds.shift();
}

// A clicked or struck body part: recoil + damage (+ maybe lose the limb)
hurtPart(part, px, py, dmg, away, opts = {}) {
if (this.invuln) return;
this.health -= dmg;
this.limbHP[part] -= dmg;
this.recoil[part] = 1;
this.recoilSide = away * this.dir;
this.blood(px, py, opts.bullet ? 14 : 8, opts.bullet ? 5 : 7, away);
if (opts.bullet) { this.addWound(part); this.bleeders.push({ part: 'wound', x: px - this.x, y: py - this.y, t: 50 }); }
particles.push({ type: 'text', x: px, y: py - 10, text: `-${dmg}`, color: '#ef4444', life: 30, vx: away, vy: -2 });
screenShake = Math.max(screenShake, 3);
if (part !== 'torso' && this.limbs[part] && this.limbHP[part] <= 0) this.dismember(part, away, opts.bullet && part === 'head');
if (this.health > 0 && !['ragdoll', 'held', 'finisher', 'downed'].includes(this.state) && mouse.draggedAgent !== this) {
this.state = 'flinch'; this.timer = 0; this.vx += away * 2;
this.say(pick(['Ow!', 'Hey!', 'Ouch!', 'Quit it!']), 30);
}
}

dismember(part, away = this.dir, explode = false) {
if (!this.limbs[part]) return;
const P = this.getParts();
this.limbs[part] = false;
this.stains = this.stains.filter((st) => st.part !== part);
let bx, by;
if (part === 'head') {
[bx, by] = P.head;
this.health = 0;
if (this.role === 'gunslinger')
particles.push({ type: 'hat', x: bx, y: by - 12, vx: away * 2 + (R() - 0.5) * 3, vy: -6 - R() * 4, angle: 0, spin: (R() - 0.5) * 0.4, life: 900 });
if (explode) {
// head pops like a water balloon
this.blood(bx, by, 55, 18, away);
this.gibs(bx, by, 14, away);
burst(bx, by, 150, 12, this);
splatScreen(2);
particles.push({ type: 'ring', x: bx, y: by, radius: 4, maxRadius: 70, color: BLOOD, life: 20 });
particles.push({ type: 'text', x: bx, y: by - 30, text: 'HEADSHOT!', color: '#facc15', life: 50, vx: 0, vy: -2 });
this.bleeders.push({ part, t: 320, power: this.finishedBy ? 1.8 : 1 });
screenShake = Math.max(screenShake, 16); flashFrame = Math.max(flashFrame, 3);
return;
}
particles.push({ type: 'head', x: bx, y: by, vx: away * (3 + R() * 5), vy: -8 - R() * 6, angle: 0, spin: (R() - 0.5) * 0.5, life: 900, color: this.skinColor, wounds: this.wounds.filter((w) => w.part === 'head') });
} else {
const s = P[part];
bx = (s[0] + s[4]) / 2; by = (s[1] + s[5]) / 2;
particles.push({
type: 'limb', x: bx, y: by, len: Math.max(30, Math.hypot(s[4] - s[0], s[5] - s[1])),
angle: Math.atan2(s[5] - s[1], s[4] - s[0]), spin: (R() - 0.5) * 0.6,
vx: away * (3 + R() * 6), vy: -5 - R() * 6, life: 900,
color: this.skinColor, accent: this.accent, thick: part.startsWith('leg') ? 6 : 4.5,
});
}
this.bleeders.push({ part, t: 320, power: this.finishedBy ? 1.8 : 1 });
this.blood(bx, by, 32, 12, away);
gush(bx, by, Math.atan2(-1, away), 9, 50, 0.6, this);
this.gibs(bx, by, 4, away);
particles.push({ type: 'text', x: bx, y: by - 20, text: pick(['RIP!', 'SNAP!', 'SPLAT!', 'CRUNCH!', 'SPLORCH!']), color: BLOOD, life: 35, vx: away, vy: -3 });
screenShake = Math.max(screenShake, 10);
}

// Blow apart into pieces
shatter(away = this.dir) {
for (const part of ['armL', 'armR', 'legL', 'legR', 'head']) this.dismember(part, R() < 0.5 ? away : -away);
const P = this.getParts();
this.blood(P.torso[0], P.torso[1] - 20, 80, 20);
burst(P.torso[0], P.torso[1] - 20, 260, 15, this);
splatScreen(5);
this.gibs(P.torso[0], P.torso[1] - 20, 16);
this.health = 0; this.invuln = false; this.doomed = false; this.finishedBy = null;
this.state = 'ragdoll'; this.timer = 0;
screenShake = 25; flashFrame = 5;
}

// ---------- Gunslinger guns ----------
muzzle() {
const P = this.getParts();
const a = this.dir === 1 ? -this.aimA : Math.PI + this.aimA;
return [P.armR[4] + Math.cos(a) * 18, P.armR[5] + Math.sin(a) * 18];
}

gunFx(mx, my) {
const d = this.dir;
particles.push({ type: 'flash', x: mx, y: my, life: 4 });
for (let i = 0; i < 3; i++) particles.push({ type: 'smoke', x: mx, y: my, r: 3, vx: d * R() * 1.5, vy: -0.5 - R(), life: 30 + R() * 20 });
particles.push({ type: 'casing', x: this.x, y: this.y - 62, vx: -d * (1 + R() * 2), vy: -3 - R() * 2, angle: 0, spin: R() * 0.8, life: 240 });
this.kick = 1;
screenShake = Math.max(screenShake, 2.5);
}

// aim at a body part of the target (headshots are rarer)
aimAt(foe) {
if (!foe) { this.aimA = 0; return null; }
const P = foe.getParts();
const r = R();
const pt = r < 0.12 && foe.limbs.head ? P.head : r < 0.7 ? [(P.torso[0] + P.torso[2]) / 2, (P.torso[1] + P.torso[3]) / 2] : [P.legR[2], P.legR[3]];
const [mx, my] = this.muzzle();
this.aimA = Math.max(-0.9, Math.min(0.9, Math.atan2(-(pt[1] - my), Math.abs(pt[0] - mx))));
return pt;
}

fireBullet(dmg, spread) {
if (this.ammo <= 0 || !this.limbs.armR) return;
this.ammo--;
const pt = this.aimAt(this.targetAgent);
const [mx, my] = this.muzzle();
let ang = pt ? Math.atan2(pt[1] - my, pt[0] - mx) : (this.dir === 1 ? 0 : Math.PI);
ang += (R() - 0.5) * spread * 2 * enemyDiff(this).spread;
bullets.push({ x: mx, y: my, vx: Math.cos(ang) * 17, vy: Math.sin(ang) * 17, owner: this, dmg, life: 90 });
this.gunFx(mx, my);
}

// instant shot used by the High Noon finisher
hitscan(v, part, dmg) {
const P = v.getParts();
const pt = part === 'head' ? P.head : part === 'torso' ? [P.torso[2], P.torso[3] + 10] : [P[part][2], P[part][3]];
const [mx, my] = this.muzzle();
particles.push({ type: 'tracer', x: mx, y: my, x2: pt[0], y2: pt[1], life: 6 });
this.gunFx(mx, my);
const away = Math.sign(pt[0] - mx) || this.dir;
v.blood(pt[0], pt[1], 22, 6, away);
gush(pt[0], pt[1], Math.atan2(pt[1] - my, pt[0] - mx), 11, 45, 0.35, v); // blown out the back
v.addWound(part);
v.recoil[part] = 1; v.recoilSide = away * v.dir;
if (part === 'head') { v.invuln = false; v.dismember('head', away, true); }
else if (part !== 'torso') v.dismember(part, away);
else v.gibs(pt[0], pt[1], 3, away);
return pt;
}

gunTick() {
if (this.kick > 0) this.kick *= 0.8;
const g = GUN_MOVES[this.state];
if (this.targetAgent && (g || this.state === 'stand')) this.aimAt(this.targetAgent);
if (g && g.shots.includes(this.timer)) this.fireBullet(g.dmg, g.spread);
if (this.state === 'reload') {
if (this.timer === 8) {
for (let i = 0; i < 6; i++) particles.push({ type: 'casing', x: this.x + this.dir * 8, y: this.y - 50, vx: (R() - 0.5) * 3, vy: -1 - R() * 2, angle: 0, spin: R() * 0.8, life: 240 });
this.say(pick(['Reloadin\'!', 'Cover me!', '*click click*']), 40);
}
if (this.timer === 80) this.ammo = 6;
}
}

gunslingerAI(foe, dx, dist) {
const busy = GUN_MOVES[this.state] || ['reload', 'pistol_whip'].includes(this.state);
if (busy) return;
this.dir = Math.sign(dx) || 1;
if (!this.limbs.armR) { // no gun hand: just kick and run
if (dist < 60 && R() < 0.3) { this.state = 'front_kick'; this.timer = 0; } else { this.state = 'run'; this.vx -= this.dir * 0.9; }
return;
}
if (this.ammo <= 0) { this.state = 'reload'; this.timer = 0; return; }
const pinned = (this.dir === 1 && this.x < 70) || (this.dir === -1 && this.x > width - 70);
const go = (s) => { this.state = s; this.timer = 0; };
if (dist < 60) {
if (R() < 0.5 || pinned) go('pistol_whip');
else { go('dive_shot'); this.vy = -10; this.vx = -this.dir * 9; this.isGrounded = false; }
} else if (dist < 170 && !pinned) {
if (R() < 0.05 * enemyDiff(this).gunRate) go('hip_shot');
else if (R() < 0.5) { this.state = 'walk'; this.vx -= this.dir * 0.5; } // backpedal (slower now, so melee can catch up)
else this.state = 'stand';
} else if (dist > 450) {
this.state = 'run'; this.vx += this.dir * 0.7;
} else if (R() < 0.045 * enemyDiff(this).gunRate) {
go(this.ammo >= 4 && R() < 0.3 ? 'fan_hammer' : 'quickdraw');
if (this.state === 'fan_hammer') this.say('Yeehaw!', 30);
} else {
this.state = 'stand';
}
}

// push out of cubes / pillars and bonk your head on the bottom of them
collideSolids() {
const top = this.y - 64, bot = this.y + this.footOff - 6;
for (const b of solidsNear(this.x)) {
if (b.type !== 'cube' && b.type !== 'pillar') continue;
const L = this.x - 9, Rt = this.x + 9;
if (Rt <= b.x || L >= b.x + b.w || bot <= b.y || top >= b.y + b.h) continue;
const pl = Rt - b.x, pr = b.x + b.w - L, pd = b.y + b.h - top;
if (this.vy < 0 && pd < pl && pd < pr) { this.y += pd; this.vy = 0; continue; }
if (pl < pr) { this.x = b.x - 9; this.bumpSide(-1, b); } else { this.x = b.x + b.w + 9; this.bumpSide(1, b); }
}
}
bumpSide(side, b) {
if (this.state === 'ragdoll') { this.vx = Math.abs(this.vx) * 0.4 * side; return; }
if (this.vx * side < 0) this.vx = 0;
const tooTall = b && b.y < this.y + this.footOff - 150; // can't jump that high
// the AI hops over things in its way
if (!this.isPlayer && !tooTall && this.isGrounded && this.health > 0 && (this.state === 'run' || this.state === 'walk' || this.state === 'zwalk')) {
this.state = 'flip'; this.timer = 0; this.vy = -14; this.vx = -side * 5; this.isGrounded = false;
} else if (['phantom_slash', 'dropkick'].includes(this.state)) { this.state = 'stand'; this.timer = 0; }
}

// ---------- AI navigation: dodge traps, handle ledges and gaps, find a way around ----------
// is it safe to land around here? (ground not too far down, and no trap)
safeLanding(x) {
if (!noFloor && !stage.length) return true;
const feet = this.y + this.footOff, lx = Math.max(32, Math.min(width - 32, x));
const g = surfaceBelow(lx, feet - 40);
return g < height && g < feet + 140 && !trapAt(lx, g);
}
// attacks that launch you forward: swap for a standing attack if it would send you off a ledge or into a trap
safeMove(m, moves) {
const LUNGE = { rewind_dash: 200, lunge_bite: 170, spring_kick: 200, jump_kick: 250, flying_knee: 250, tornado_kick: 250, dropkick: 300, phantom_slash: 190, vault_kick: 450, suplex: -140 };
if (!LUNGE[m] || this.safeLanding(this.x + this.dir * LUNGE[m])) return m;
return moves.find((k) => !LUNGE[k]) || m;
}
leap(dir, speed) { this.state = 'flip'; this.timer = 0; this.vy = -14; this.vx = dir * speed; this.dir = dir; this.isGrounded = false; this.softLand = true; }
halt() { this.vx = 0; this.state = 'stand'; this.targetX = null; this.halted = true; }
navigate() {
if (this.isPlayer || this.health <= 0 || this.invuln) return;
if (!stage.length && !noFloor) return; // plain arena: nothing to navigate
const wasHalted = this.halted; this.halted = false;
const feet = this.y + this.footOff;
// standing in a trap? jump out of it, away from its middle
const inTrap = this.isGrounded && trapAt(this.x, feet);
if (inTrap && !ALL_ATTACKS.has(this.state) && this.state !== 'flip') {
const away = Math.sign(this.x - (inTrap.x + inTrap.w / 2)) || (R() < 0.5 ? 1 : -1);
this.leap(away, 8); this.vy = -12;
if (R() < 0.3) this.say(pick(['Yikes!', 'Nope!', 'Get me out!']), 25);
return;
}
if (!this.isGrounded || !['run', 'walk'].includes(this.state) || Math.abs(this.vx) < 0.5) { this.trackStuck(wasHalted && this.isGrounded && this.state === 'stand'); return; }
const dir = Math.sign(this.vx);
const foe = this.targetAgent && agents.includes(this.targetAgent) && this.targetAgent.health > 0 ? this.targetAgent : null;
// a trap ahead: jump it if we can, otherwise wait for it
const trap = trapAhead(this.x, feet, dir);
if (trap) {
const low = ['lava', 'spikes', 'mine'].includes(trap.type) || (trap.type === 'saw' && trap.y > feet - 130);
if (low && trap.w < 330) {
// find where the danger ends (traps right next to each other count as one zone)
let edge = dir > 0 ? trap.x + trap.w + (trap.type === 'saw' ? 40 : 0) : trap.x - (trap.type === 'saw' ? 40 : 0);
for (let px = edge; Math.abs(px - edge) < 60; px += dir * 10) if (trapAt(px, feet)) edge = px;
const far = Math.abs(edge - this.x) + 40;
const land = surfaceBelow(this.x + dir * far, feet - 40);
if (far < 480 && land < height) this.leap(dir, Math.min(11, Math.max(4, far / 44))); // ~44 frames in the air
else this.halt();
} else this.halt(); // lasers and crushers: wait for a safe moment
return;
}
// a ledge ahead
const ahead = this.x + dir * 26;
const land = surfaceBelow(ahead, feet - 2), drop = land - feet;
if (drop > 40) {
const foeBelow = foe && foe.y + foe.footOff > feet + 40;
const safe = land < height && !trapAt(ahead, land);
if (!(safe && (drop < 140 || (foeBelow && drop < 320)))) { // too far down (or the void): jump across if there's somewhere to land
const v = jumpTarget(this.x, feet, dir, foeBelow ? 320 : 90);
if (v && (foe || this.targetX != null)) { this.leap(dir, v); this.softLand = true; } else this.halt();
return;
}
this.softLand = true; // stepping down on purpose: land on your feet
}
// a step right in front of us: hop up (or a floating platform when the target is up there)
for (const b of solidsNear(this.x + dir * 40)) {
if (b.type === 'ramp') continue;
const edge = dir > 0 ? b.x : b.x + b.w, gap = dir * (edge - this.x);
if (gap < 4 || gap > 50 || b.y > feet - 15 || b.y < feet - 150) continue;
const blocking = b.y + b.h > feet - 60;
const wantUp = foe && foe.y + foe.footOff < feet - 30;
if (blocking || wantUp) { this.leap(dir, 5); return; }
}
this.trackStuck(true);
}
// not getting anywhere? take a detour (a ramp or bounce pad on our level, or just try the other way)
trackStuck(trying) {
const foe = this.targetAgent;
// only counts when we're actually trying to get somewhere (not while stunned, attacking or waiting in range)
if (!trying || !foe || this.detourX != null || ALL_ATTACKS.has(this.state) || !agents.includes(foe)) { this.stuckT = 0; this.lastX = this.x; return; }
const feet = this.y + this.footOff;
const far = Math.abs(foe.x - this.x) > 90 || Math.abs((foe.y + foe.footOff) - feet) > 60;
const timed = trapAhead(this.x, feet, Math.sign(foe.x - this.x) || this.dir);
if (timed && (timed.type === 'laser' || timed.type === 'crusher')) { this.stuckT = 0; this.lastX = this.x; return; } // just waiting for a trap: not stuck
if (far && Math.abs(this.x - (this.lastX ?? this.x)) < 2) {
if (++this.stuckT > 50) { this.stuckT = 0; this.chooseDetour(foe); this.say(pick(['Hmm...', 'Another way!', 'Let me think...']), 30); }
} else this.stuckT = 0;
this.lastX = this.x;
}
chooseDetour(foe) {
const feet = this.y + this.footOff, foeHigher = foe.y + foe.footOff < feet - 40;
let best = null, bd = 1e9;
for (const b of stage) {
if (b.type !== 'bounce' && b.type !== 'ramp') continue;
if (b.type === 'bounce' && !foeHigher) continue;
const tx = b.type === 'ramp' ? (b.flip ? b.x + b.w - 12 : b.x + 12) : b.x + b.w / 2; // the low end of a ramp
if (Math.abs(b.y + b.h - feet) > 60) continue; // must be on our level
const d = Math.abs(tx - this.x) + Math.abs(tx - foe.x) * 0.5;
if (d < bd) { bd = d; best = tx; }
}
if (best == null && !foeHigher) return; // nothing better to try: keep waiting
this.detourX = best ?? Math.max(40, Math.min(width - 40, this.x - Math.sign(foe.x - this.x || 1) * 220));
this.detourT = 240;
}
followDetour() {
if (this.detourX == null) return false;
const dx = this.detourX - this.x;
if (Math.abs(dx) < 14 || --this.detourT <= 0) { this.detourX = null; return false; }
this.dir = Math.sign(dx); if (this.isGrounded) { this.state = 'run'; this.vx += this.dir * 1.0 * enemyDiff(this).speed; }
return true;
}

// (old) AI on a floorless stage: stop at ledges, or jump the gap if the target is across it
edgeCheck() {
if (!noFloor || !this.isGrounded || !this.vx || !['run', 'walk'].includes(this.state)) return;
const dir = Math.sign(this.vx), feet = this.y + this.footOff;
if (surfaceBelow(this.x + dir * 28, feet - 2) < feet + 120) return; // ground ahead, all good
const foe = this.targetAgent;
if (foe && Math.sign(foe.x - this.x) === dir && Math.abs(foe.x - this.x) < 330 && foe.y < this.y + 100 && R() < 0.5) {
this.state = 'flip'; this.timer = 0; this.vy = -14; this.vx = dir * 8; this.isGrounded = false;
} else { this.vx = 0; this.state = 'stand'; this.targetX = null; }
}

// should this AI start an attack right now?
wantsAttack() {
const d = enemyDiff(this);
if (R() >= d.attack) return false;
if (this.team !== 'enemy') return true;
const swinging = agents.filter((o) => o !== this && o.team === 'enemy' && o.health > 0 && ALL_ATTACKS.has(o.state)).length;
return swinging < d.maxAttackers;
}

// ---------- Zombies ----------
becomeZombie() {
Object.assign(this, { zombie: true, team: 'zombie', infected: false, riseT: null, eaten: false, invuln: false, doomed: false, pancake: false, flat: 0, landFx: null, finishedBy: null, finVictim: null,
crushed: false, shredded: false, burn: 0, stunT: 0, bleeders: [], weapon: 'none', targetAgent: null, detourX: null, aggression: 1 });
this.health = this.maxHealth = this.hpShown = 70;
this.skinColor = this.role === 'willie' ? '#3d4a3a' : '#4d6b45';
this.backLimbColor = this.role === 'willie' ? '#2b352a' : '#36503a';
this.soak = Math.min(this.soak, 0.3);
this.state = 'rise'; this.timer = 0; this.vx = 0;

if (!fresh) return false;
if (!foe) { this.say('No one to finish!', 30); return false; }

if (T % 3 === 0 && T < 95) { const a = R() * Math.PI * 2; particles.push({ type: 'bat', x: v.x + Math.cos(a) * 70, y: v.y - 40 + Math.sin(a) * 40, vx: -Math.sin(a) * 4, vy: Math.cos(a) * 3, life: 40, size: 0.7 + R() * 0.5, ph: R() * 6 }); }

}

}

} else if (this.role === 'willie') {

}

burst(v.x, v.y - 30, 40, 7, v);

}
if (T >= 110 || (T >= 55 && !v.landFx)) this.endFinisher(false);
}
}

think() {
if (this.finVictim && this.state !== 'finisher') this.endFinisher(true);
if (this.health <= 0) {
if (this.state !== 'ragdoll') this.state = 'knockout';
this.eyeState = 'dead';
// bitten by a zombie? you come back as one
if (this.infected && !this.zombie && !this.fallen && !this.eaten && !this.isPlayer) {
this.riseT = (this.riseT ?? 220) - 1;
if (this.riseT === 60) this.say('...', 50);
if (this.riseT <= 0) this.becomeZombie();
}
return;
}
if (this.state === 'held') {
const f = this.finishedBy;
if (!f || !agents.includes(f) || f.state !== 'finisher' || f.finVictim !== this) {
this.state = 'stand'; this.invuln = false; this.finishedBy = null;
}
this.eyeState = 'shocked';
return;
}
if (this.state === 'finisher') { this.eyeState = 'angry'; this.runFinisher(); return; }
if (this.isPlayer && this.playerFinisherCheck()) return;
if (this.stunT > 0) { // seeing stars: can't do anything for a moment
if (--this.stunT <= 0) { if (this.state === 'stun') this.state = 'stand'; }
else if (this.state !== 'ragdoll' && mouse.draggedAgent !== this) { this.state = 'stun'; this.vx *= 0.8; }
this.eyeState = 'dizzy';
return;
}
if (this.zombie) { this.zombieThink(); return; } // zombies have their own (tiny) brain
if (!this.limbs.legL && !this.limbs.legR && this.state !== 'ragdoll' && mouse.draggedAgent !== this) {
this.state = 'downed'; this.eyeState = 'hurt'; this.vx *= 0.8;
return;
}
if (['ragdoll', 'flinch', 'stagger'].includes(this.state) || mouse.draggedAgent === this) {
this.eyeState = this.state === 'ragdoll' ? 'dizzy' : 'hurt';
return;
}
this.eyeState = this.state === 'taunt' ? 'taunt' : this.state === 'flip' ? 'shocked' : 'normal';
if (this.dodgeCooldown > 0) this.dodgeCooldown--;
if (this.isPlayer) { this.playerThink(); return; } // keyboard controls instead of AI

// Split-second dodge
if (this.dodgeCooldown === 0 && this.isGrounded && this.state !== 'flip') {
for (const other of agents) {
if (other === this || other.health <= 0 || !ACTIVE_FRAMES[other.state]) continue;
const timeToHit = ACTIVE_FRAMES[other.state] - other.timer;
const dx = this.x - other.x;
const facingUs = dx === 0 || Math.sign(dx) === other.dir;
if (facingUs && Math.abs(dx) < 130 && timeToHit > 0 && timeToHit <= 6) {
const chance = (this.role === 'ninja' ? 0.35 : this.role === 'brawler' ? 0.1 : 0.25) * enemyDiff(this).dodge;
if (R() < chance && this.safeLanding(this.x + Math.sign(dx || 1) * 300)) {
this.state = 'flip'; this.vy = -10; this.vx = Math.sign(dx || 1) * 11;
this.timer = 0; this.dodgeCooldown = 45; this.say('Dodge!', 30);
return;
}
}
}
}

// Walking to a spot
if (this.targetX !== null) {
const dx = this.targetX - this.x;
if (Math.abs(dx) > 20) {
this.dir = Math.sign(dx);
if (this.state === 'walk') this.vx += this.dir * 0.6;
if (this.state === 'run') this.vx += this.dir * 1.5;
} else {
this.targetX = null;
if (this.state === 'walk' || this.state === 'run') this.state = 'stand';
}
}

// Pick a target or wander
if (R() < 0.04 && !this.targetAgent && this.state === 'stand') {
let closest = null, minDist = this.team === 'enemy' ? 1e9 : 600; // enemies always hunt you
for (const other of agents) {
if (other === this || other.health <= 0 || (this.team && other.team === this.team)) continue;
const d = Math.hypot(this.x - other.x, this.y - other.y);
if (d < minDist) { minDist = d; closest = other; }
}
if (closest && R() < this.aggression) {
this.targetAgent = closest; this.targetX = null; this.say('Target locked!');
} else {
this.targetX = Math.max(50, Math.min(width - 50, this.x + (R() - 0.5) * 600));
this.state = 'walk';
if (R() < 0.3) {
this.state = 'run';
if (R() < 0.5 && this.safeLanding(this.x + this.dir * 350)) {
this.state = 'flip'; this.vy = -14; this.vx = this.dir * 8; this.timer = 0; this.say('Parkour!', 40);
}
}
}
}

if (this.role === 'gunslinger') this.gunTick();

// Combat
if (this.targetAgent && this.role === 'gunslinger' && this.targetAgent.health > 0 && agents.includes(this.targetAgent) && this.targetAgent.state !== 'knockout') {
this.eyeState = 'angry';
const dx = this.targetAgent.x - this.x;
this.gunslingerAI(this.targetAgent, dx, Math.abs(dx));
} else if (this.targetAgent) {
const foe = this.targetAgent;
if (foe.health <= 0 || foe.state === 'knockout' || !agents.includes(foe)) {
this.targetAgent = null; this.state = 'taunt'; this.timer = 0; this.vx = 0; this.targetX = null;
this.say(pick(['Too easy!', 'Next!', 'Pathetic.', 'Hmph.', 'Flawless.', "Who's next?!"]));
} else {
this.eyeState = 'angry';
const dx = foe.x - this.x, dist = Math.abs(dx);
const moves = COMBAT_MOVES[this.role];
const attacking = moves.includes(this.state);
if (dist > 20 && !attacking) this.dir = Math.sign(dx) || 1;
if (!attacking && this.isGrounded && foe.y < this.y - 50 && dist < 170 && R() < 0.06) { // they're up high: jump after them
this.state = 'flip'; this.timer = 0; this.vy = -15; this.vx = this.dir * 5; this.isGrounded = false;
}

const startAttack = () => {
this.state = this.coolMove(this.safeMove(pick(moves), moves)); this.timer = 0;
switch (this.state) {
case 'jump_kick': case 'flying_knee': case 'tornado_kick': case 'spring_kick': this.vy = -11; this.vx = this.dir * 7; break;
case 'dropkick': this.vy = -7; this.vx = this.dir * 14; break;
case 'phantom_slash': this.vx = this.dir * 22; break;
case 'vault_kick': this.vy = -16; this.vx = this.dir * 9; break;
case 'lunge_bite': this.vx = this.dir * 15; break;
case 'suplex': this.vy = -14; this.vx = -this.dir * 3; break;
}
};

if (!attacking && this.followDetour()) {
// taking a detour around something
} else if (attacking) {
// let the attack finish
} else if (dist > (this.role === 'willie' ? 120 : this.role === 'vampire' ? 90 : this.role === 'chronarch' ? 95 : this.weapon !== 'none' ? 110 : 75)) {
if (this.isGrounded || !stage.length) { this.state = 'run'; this.vx += this.dir * 1.0 * enemyDiff(this).speed; } // no speeding up in mid-air (it ruins jumps)
} else if (dist < 35 && this.weapon === 'none') {
const pinned = (this.dir === 1 && this.x < 45) || (this.dir === -1 && this.x > width - 45);
if (pinned) { if (this.wantsAttack()) startAttack(); else this.state = 'stand'; }
else { this.state = 'walk'; this.vx -= this.dir * 0.8; }
} else {
if (this.wantsAttack()) startAttack(); else this.state = 'stand';
}
}
}
this.navigate();
this.mouthOpen = this.thoughts.length > 0 ? Math.abs(Math.sin(this.timer * 0.5)) * 4 : 0;
}

updatePhysics() {
if (this.fallen) return;
if (this.levitate || this.rewinding) { this.vx = 0; this.vy = 0; this.isGrounded = false; return; } // held up in the air / rewinding through time
if (mouse.draggedAgent === this) return;
if (this.fallCD > 0) this.fallCD--;
if (this.state === 'held') this.vx = 0;
this.vy += 0.6;
// find the lowest body part so feet (or a lying body) rest ON the ground instead of sinking into it
const P0 = this.getParts();
let low = Math.max(P0.torso[1], P0.torso[3]) + 7;
if (this.limbs.head) low = Math.max(low, P0.head[1] + 14);
for (const part of ['legL', 'legR']) if (this.limbs[part]) low = Math.max(low, P0[part][3] + 5, P0[part][5] + 6);
for (const part of ['armL', 'armR']) if (this.limbs[part]) low = Math.max(low, P0[part][5] + 4);
this.footOff += (Math.max(8, Math.min(54, low - this.y)) - this.footOff) * 0.35;
const floorY = groundFor(this) - this.footOff; // floor or the top of a block
this.isGrounded = false;

if (this.y + this.vy > floorY || (this.wasGrounded && this.vy >= 0 && this.y + this.vy > floorY - 12)) {
this.y = floorY;
this.isGrounded = true;
if (this.lastVy > 6) this.squash = Math.min(0.28, this.lastVy * 0.018);
// Fall damage — works for thrown, launched and knocked-back fighters
if (this.lastVy > 13 && this.fallCD <= 0 && (this.thrown || this.doomed)) { // only throws (picked up with the mouse) cause fall damage
this.fallCD = 12; this.thrown = false;
if (this.doomed && this.landFx) { // a finisher landing that crushes instead of exploding
const fx = this.landFx; this.landFx = null;
this.doomed = false; this.invuln = false; this.finishedBy = null;
this.health = 0; this.state = 'ragdoll'; this.timer = 0; this.vx = 0;
this.flat = 1; this.pancake = true; // flattened into the floor
this.blood(this.x, this.y - 6, 30, 10);
addPool(this.x, 22);
for (let i = 0; i < 26; i++) particles.push({ type: 'smoke', x: this.x + (R() - 0.5) * 60, y: this.y - 4, r: 5 + R() * 7, vx: (R() < 0.5 ? -1 : 1) * (2 + R() * 6), vy: -R() * 2.5, life: 45 + R() * 25 });
for (let i = 0; i < 14; i++) particles.push({ type: 'spark', x: this.x + (R() - 0.5) * 40, y: this.y - 2, text: '•', color: '#78716c', life: 30, vx: (R() - 0.5) * 10, vy: -4 - R() * 6 }); // chunks of floor
decals.push({ kind: 'crack', x: this.x, y: this.y + 2, segs: Array.from({ length: 7 }, (_, i) => ({ a: Math.PI + (i / 6) * Math.PI * -1 * 0 + (i - 3) * 0.45, l: 25 + R() * 35, k: (R() - 0.5) * 0.6 })) }); // cracked floor
if (fx === 'smite') {
particles.push({ type: 'pillar', x: this.x, life: 40 });
particles.push({ type: 'ring', x: this.x, y: this.y - 10, radius: 10, maxRadius: 200, color: '#fde047', life: 30 });
particles.push({ type: 'text', x: this.x - 40, y: this.y - 70, text: 'SMITED!', color: '#f59e0b', life: 60, vx: 0, vy: -1.5 });
} else {
particles.push({ type: 'ring', x: this.x, y: this.y - 6, radius: 10, maxRadius: 150, color: '#a8a29e', life: 25 });
particles.push({ type: 'text', x: this.x - 40, y: this.y - 70, text: 'CRATERED!', color: '#ef4444', life: 60, vx: 0, vy: -1.5 });
}
screenShake = 28; flashFrame = 4; hitStop = 10;
} else if (this.doomed) {
this.shatter(this.dir);
particles.push({ type: 'text', x: this.x, y: this.y - 40, text: 'SPLAT!', color: BLOOD, life: 50, vx: 0, vy: -2 });
} else {
const dmg = Math.round((this.lastVy - 11) * 5);
if (!this.invuln) this.health -= dmg;
screenShake = Math.max(screenShake, dmg * 0.4);
if (this.state !== 'held') { this.state = 'ragdoll'; this.timer = 0; }
this.blood(this.x, this.y - 10, Math.min(20, dmg / 3), 8);
particles.push({ type: 'text', x: this.x, y: this.y, text: `-${dmg}`, color: '#ef4444', life: 45, vx: R() * 2 - 1, vy: -3 });
if (this.lastVy > 21) {
const opts = ['armL', 'armR', 'legL', 'legR'].filter((p) => this.limbs[p]);
if (opts.length) this.dismember(pick(opts), R() < 0.5 ? 1 : -1);
particles.push({ type: 'text', x: this.x, y: this.y - 20, text: 'CRACK!', color: '#f59e0b', life: 40, vx: 0, vy: -5 });
}
}
}
if (this.state === 'ragdoll') {
this.vy = this.lastVy > 5 && !this.pancake ? -this.lastVy * 0.4 : 0; // squashed bodies don't bounce
this.vx *= 0.8;
if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5 && this.timer > 40) {
this.state = this.health > 0 ? 'stand' : 'knockout'; this.timer = 0; this.thrown = false;
}
} else {
this.vy = 0;
if (['flip', 'dropkick', 'phantom_slash'].includes(this.state)) this.vx *= 0.88;
else if (this.state === 'run' || this.state === 'walk') this.vx *= 0.82;
else this.vx *= 0.75;
}
}

// Hit detection
if (MULTI_HITS[this.state] ? MULTI_HITS[this.state].includes(this.timer) : ACTIVE_FRAMES[this.state] && this.timer === ACTIVE_FRAMES[this.state]) {
for (const other of agents) {
if (other === this || other.health <= 0 || (this.team && other.team === this.team)) continue;
const dx = other.x - this.x, dy = other.y - this.y;
let reach = (this.weapon === 'sword' || this.weapon === 'staff') ? 115 : 75;
if (this.state === 'phantom_slash' || this.state === 'dropkick') reach = 160;
if (LONG_REACH[this.state]) reach = LONG_REACH[this.state]; // stretchy rubber-hose limbs
const dirToTarget = dx === 0 ? this.dir : Math.sign(dx);
let isHit = false;
if ((dirToTarget === this.dir || OMNI.has(this.state)) && Math.abs(dx) < reach) {
if (['sweep', 'staff_sweep', 'accordion_stomp'].includes(this.state)) isHit = dy > -30 && dy < 50;
else if (['uppercut', 'jump_kick', 'flying_knee', 'axe_kick', 'vault_kick', 'windmill_uppercut'].includes(this.state)) isHit = dy > -110 && dy < 30;
else isHit = dy > -50 && dy < 40;
}
if (other.state === 'flip' && Math.abs(dx) > reach * 0.6) isHit = false;
if (isHit) this.landHit(other);
}
}

// Speed limits
if (this.state === 'walk') this.vx = Math.max(-4.5, Math.min(4.5, this.vx));
if (this.state === 'run') this.vx = Math.max(-10, Math.min(10, this.vx));
if (Math.abs(this.vx) < 0.2) this.vx = 0;

this.lastVy = this.vy;
this.x += this.vx;
this.y += this.vy;
if (stage.length) this.collideSolids();
if (this.isGrounded) this.softLand = false;
if (noFloor && this.y > height + 150) { // fell off the bottom of the stage
this.fallen = true; this.vx = 0; this.vy = 0;
if (this.health > 0) { this.health = 0; particles.push({ type: 'text', x: Math.max(30, Math.min(width - 140, this.x - 40)), y: height - 40, text: 'FELL OUT!', color: '#ef4444', life: 60, vx: 0, vy: -1.5 }); }
return;
}
this.wasGrounded = this.isGrounded;
this.coyote = this.isGrounded ? 6 : Math.max(0, (this.coyote || 0) - 1); // a few frames of grace to jump after leaving an edge

// Walls
const hitWall = (edge) => {
this.x = edge;
if (this.state === 'ragdoll') { this.vx *= -0.4; return; }
if ((edge < width / 2 && this.vx < 0) || (edge > width / 2 && this.vx > 0)) this.vx = 0;
if (['phantom_slash', 'dropkick', 'flip', 'run', 'walk'].includes(this.state)) {
this.state = 'stand'; this.timer = 0; this.targetX = null;
}
};
if (this.x <= 30) hitWall(30);
if (this.x >= width - 30) hitWall(width - 30);
}

landHit(other) {
const s = this.state, dir = OMNI.has(this.state) ? (Math.sign(other.x - this.x) || this.dir) : this.dir;
const hitType = HEAVY.includes(s) ? 'heavy' : MEDIUM.includes(s) ? 'medium' : 'light';
let dmg = this.weapon !== 'none' ? 20 : 12;
if (hitType === 'medium') dmg *= 1.5;
if (hitType === 'heavy') dmg *= 2.5;
if (this.role === 'willie') dmg *= 0.7; // long reach, so each hit is a bit lighter
if (s === 'hypno_gaze') dmg = 3; // the gaze barely hurts... it just freezes you
if (s === 'stasis_bubble') dmg = 5;
if (this.role === 'chronarch') dmg *= 0.6;
if (other.invuln || other.dodgeIF > 0) return;
if (this.team === 'enemy' && other.isPlayer) dmg *= DIFFICULTY[difficulty].dmg;

// A blow that would kill → usually triggers this class's finisher instead
if (!this.isPlayer && other.health - dmg <= 0 && other.limbs.head && !other.finishedBy && !this.finVictim && R() < (this.team === 'enemy' ? DIFFICULTY[difficulty].finisher : 0.75)) {
this.startFinisher(other);
return;
}

other.health -= dmg;
if (s === 'decay_pulse') { other.slowT = Math.max(other.slowT || 0, 90); particles.push({ type: 'text', x: other.x - 30, y: other.y - 85, text: 'SLOWED', color: '#a855f7', life: 35, vx: 0, vy: -1.5 }); }
if (s === 'stasis_bubble') { other.frozenT = Math.max(other.frozenT || 0, 55); particles.push({ type: 'text', x: other.x - 30, y: other.y - 95, text: 'STASIS', color: '#22d3ee', life: 40, vx: 0, vy: -1.5 }); }
if (this.role === 'vampire') { // life steal
const heal = dmg * (s === 'lunge_bite' ? 0.6 : 0.3);
this.health = Math.min(this.maxHealth, this.health + heal);
particles.push({ type: 'text', x: this.x - 10, y: this.y - 100, text: `+${Math.round(heal)}`, color: '#dc2626', life: 25, vx: 0, vy: -1.5 });

function drawWorld() {

function drawParticles() {
ctx.textAlign = 'left';
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.life--;
if (p.vx) p.x += p.vx;
if (p.vy) p.y += p.vy;
if (p.type === 'spark' || p.type === 'blood') p.vy += 0.3;
ctx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.type === 'ring' ? 25 : 15)));

if (p.type === 'ring') {
ctx.strokeStyle = p.color; ctx.lineWidth = 3 + (p.life / 25) * 6;
ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke();
p.radius += (p.maxRadius - p.radius) * 0.15;
} else if (p.type === 'streak') {
ctx.strokeStyle = p.color; ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.sign(p.vx) * p.length, p.y); ctx.stroke();
} else if (p.type === 'spark') {
ctx.fillStyle = p.color;

else { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); }
} else if (p.type === 'blood') {
if (gore <= 0) { p.life = 0; particles.splice(i, 1); ctx.globalAlpha = 1; continue; } // blood turned off
const s = p.size || 3;
p.age = (p.age || 0) + 1; p.vx *= 0.992; // air drag
if (stage.length && hitSolid(p.x, p.y)) { addDecal(p.x, p.y, s * 1.3, s * 0.6); p.life = 0; } // splats on blocks
else if (p.y > height + 20) { p.life = 0; } // fell into the void
else if (!noFloor && p.y >= height - 72) { // hits the floor: puddle + little splash
if (!p.splash) {
addPool(p.x, s);
if (R() < 0.25) for (let k = 0; k < 2; k++) particles.push({ type: 'blood', splash: true, x: p.x, y: height - 74, size: s * 0.5, color: p.color, life: 30, vx: (R() - 0.5) * 3 + p.vx * 0.2, vy: -1 - R() * 2.5 });
} else addDecal(p.x, height - 70 + R() * 3, s * 1.2, s * 0.4);
p.life = 0;
}
else if (p.x <= 2 || p.x >= width - 2) { addDrip(p.x <= 2 ? 1 : width - 1, p.y, s); p.life = 0; } // wall splat that runs down
else if (stickBlood(p)) { p.life = 0; } // landed on a fighter

ctx.globalAlpha = Math.min(1, p.life / 15);
ctx.strokeStyle = p.color; ctx.lineWidth = s * 1.5; ctx.lineCap = 'round';
ctx.beginPath(); ctx.moveTo(p.x - (p.vx / sp) * tail, p.y - (p.vy / sp) * tail); ctx.lineTo(p.x, p.y); ctx.stroke();
ctx.fillStyle = 'rgba(255,170,170,0.35)'; ctx.beginPath(); ctx.arc(p.x - s * 0.3, p.y - s * 0.3, s * 0.35, 0, Math.PI * 2); ctx.fill();
ctx.lineCap = 'butt';
}
} else if (p.type === 'gib') {
p.vy += 0.45; p.spin += 0.2;
const gy = surfaceBelow(p.x, p.y - 20) - 2;
if (p.y > height + 60) p.life = 0;
if (p.y >= gy) {
addDecal(p.x, gy + 2, p.size * 2.2, p.size * 0.7);
p.y = gy; p.vy *= -0.35; p.vx *= 0.6;

}

ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.7, p.spin, 0, Math.PI * 2); ctx.fill();

ctx.beginPath(); ctx.arc(p.x - 1, p.y - 1, p.size * 0.45, 0, Math.PI * 2); ctx.fill();
} else if (p.type === 'flash') {

} else if (p.type === 'tracer') {

} else if (p.type === 'casing') {
p.vy += 0.4; p.angle += p.spin;

p.y = fy; p.vy *= -0.3; p.vx *= 0.7; p.spin *= 0.6;

if (Math.abs(p.vx) < 0.2) p.vx = 0;
}

p.angle += p.spin;
ctx.save();
ctx.translate(p.x, p.y); ctx.rotate(p.angle);

ctx.fillStyle = BLOOD; ctx.beginPath(); ctx.arc(-p.len / 2, 0, p.thick * 0.8, 0, Math.PI * 2); ctx.fill();

} else if (p.type === 'hat') {
drawHat(0, 0);
} else {
ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = BLOOD; ctx.beginPath(); ctx.arc(0, 12, 6, 0, Math.PI * 2); ctx.fill();
for (const w of p.wounds || []) { ctx.fillStyle = DARK_BLOOD; ctx.beginPath(); ctx.arc(w.ox, w.oy, 2.5, 0, Math.PI * 2); ctx.fill(); }
ctx.fillStyle = 'white'; ctx.font = '9px sans-serif';
ctx.fillText('x', 1, -1); ctx.fillText('x', -8, -1);
}
ctx.restore();
} else if (p.type === 'pillar') {
const g = ctx.createLinearGradient(p.x - 30, 0, p.x + 30, 0);
g.addColorStop(0, 'rgba(253,224,71,0)'); g.addColorStop(0.5, 'rgba(254,249,195,0.9)'); g.addColorStop(1, 'rgba(253,224,71,0)');
ctx.fillStyle = g; ctx.fillRect(p.x - 30, -50, 60, height - 20);
} else if (p.type === 'echo') { // see-through afterimage
const P = p.P, ox = p.x;
ctx.globalAlpha = Math.max(0, (p.life / p.max) * 0.55);
ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
ctx.beginPath(); ctx.moveTo(P.torso[0] + ox, P.torso[1]); ctx.lineTo(P.torso[2] + ox, P.torso[3]);
for (const k of ['armL', 'armR', 'legL', 'legR']) { const l = P[k]; ctx.moveTo(l[0] + ox, l[1]); ctx.lineTo(l[2] + ox, l[3]); ctx.lineTo(l[4] + ox, l[5]); }
ctx.stroke();
if (p.head) { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(P.head[0] + ox, P.head[1], 13, 0, Math.PI * 2); ctx.fill(); }
ctx.lineCap = 'butt';
} else if (p.type === 'ash') { // flake of ash drifting on the wind
p.vx *= 0.99; p.vy -= 0.01;
ctx.globalAlpha = Math.min(0.85, p.life / 40);
ctx.fillStyle = p.life % 20 < 10 ? '#78716c' : '#a8a29e';
ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 0.15); ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); ctx.restore();
} else if (p.type === 'twinkle') { // the little star where a cartoon flies off into the distance
const k = Math.sin((p.life / 50) * Math.PI) * 14;
ctx.globalAlpha = 1; ctx.fillStyle = '#111827';
ctx.beginPath();

ctx.restore();

ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - sz * 1.6, p.y - f * sz); ctx.lineTo(p.x - sz * 0.9, p.y + sz * 0.2); ctx.lineTo(p.x - sz * 0.5, p.y - f * sz * 0.3);
ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + sz * 1.6, p.y - f * sz); ctx.lineTo(p.x + sz * 0.9, p.y + sz * 0.2); ctx.lineTo(p.x + sz * 0.5, p.y - f * sz * 0.3); ctx.fill();

} else if (p.type === 'fire') {

p.r *= 0.96;
ctx.globalAlpha = Math.min(1, k * 1.6);

}

function drawDecals() {
ctx.fillStyle = DARK_BLOOD;
ctx.globalAlpha = 0.9;
for (const d of decals) {
if (d.kind === 'drip') { // runs down the wall
if (d.len < d.max) d.len += 0.25;
ctx.fillRect(d.x - d.w / 2, d.y, d.w, d.len);
ctx.beginPath(); ctx.arc(d.x, d.y + d.len, d.w * 0.8, 0, Math.PI * 2); ctx.fill();
} else if (d.kind === 'crack') { // crater cracks in the floor
ctx.save(); ctx.globalAlpha = 0.75; ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
for (const g of d.segs) {
const ex = d.x + Math.sin(g.a) * g.l, mx = d.x + Math.sin(g.a) * g.l * 0.5 + g.k * 12;
ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(mx, d.y + 3 + Math.abs(g.k) * 6); ctx.lineTo(ex, d.y + 1); ctx.stroke();
}
ctx.restore(); ctx.fillStyle = DARK_BLOOD;
} else { ctx.beginPath(); ctx.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, Math.PI * 2); ctx.fill(); }
}
for (const p of pools) { // puddles slowly spread out
p.rx += (p.target - p.rx) * 0.03;
const ry = Math.min(9, 2 + p.rx * 0.12);
ctx.fillStyle = '#5c0b0b'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, ry, 0, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = BLOOD; ctx.beginPath(); ctx.ellipse(p.x, p.y - 0.5, p.rx * 0.82, ry * 0.7, 0, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.ellipse(p.x - p.rx * 0.25, p.y - ry * 0.3, p.rx * 0.3, ry * 0.25, 0, 0, Math.PI * 2); ctx.fill();
}
ctx.globalAlpha = 1;
}

function drawScreenSplats() {
for (let i = screenSplats.length - 1; i >= 0; i--) {
const s = screenSplats[i];
if (--s.life <= 0) { screenSplats.splice(i, 1); continue; }
if (s.drip < s.dripMax) s.drip += 0.6;
ctx.globalAlpha = Math.min(0.85, s.life / 80);
ctx.fillStyle = BLOOD;
ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
for (const [bx, by, br] of s.blobs) { ctx.beginPath(); ctx.arc(s.x + bx * s.r, s.y + by * s.r, s.r * br, 0, Math.PI * 2); ctx.fill(); }
ctx.fillRect(s.x - s.r * 0.15, s.y, s.r * 0.3, s.drip);
ctx.beginPath(); ctx.arc(s.x, s.y + s.drip, s.r * 0.2, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(s.x - s.r * 0.35, s.y - s.r * 0.35, s.r * 0.25, 0, Math.PI * 2); ctx.fill();
}

function updateBullets() {
for (let i = bullets.length - 1; i >= 0; i--) {
const b = bullets[i];
const stopped = timeStop && b.owner !== timeStop.by; // frozen in mid-air during a time stop
let dead = !stopped && --b.life <= 0;
// move in small steps so bullets can't skip through thin stickmen
for (let step = 0; step < 4 && !dead && !stopped; step++) {
b.x += b.vx / 4; b.y += b.vy / 4;
if (b.x < 0 || b.x > width || b.y < -50 || b.y > height + 50) { dead = true; break; }
if (stage.length && hitSolid(b.x, b.y)) { // blocks stop bullets — take cover!
dead = true;
for (let k = 0; k < 5; k++) particles.push({ type: 'spark', x: b.x, y: b.y, text: '•', color: '#fde047', life: 10, vx: -Math.sign(b.vx) * R() * 5, vy: (R() - 0.5) * 6 });
break;
}
if (!noFloor && b.y >= height - 72) { // hit the floor
dead = true;
for (let k = 0; k < 4; k++) particles.push({ type: 'spark', x: b.x, y: height - 72, text: '•', color: '#fde047', life: 10, vx: (R() - 0.5) * 6, vy: -R() * 4 });
break;
}
for (const s of agents) {
if (s === b.owner || (s.invuln && s.state === 'held') || s.dodgeIF > 0 || (b.owner.team && b.owner.team === s.team)) continue;
const h = partAt(s, b.x, b.y);
if (!h) continue;
const dirX = Math.sign(b.vx) || 1;
// Ninjas can deflect bullets with their sword
if (s.role === 'ninja' && s.health > 0 && s.limbs.armR && s.dir === -dirX && !['ragdoll', 'flinch', 'stagger', 'held', 'downed'].includes(s.state) && R() < 0.3 * enemyDiff(s).dodge) {
b.vx = -b.vx; b.vy = -b.vy * 0.5; b.owner = s;
s.state = 'slash'; s.timer = 6;
s.say('Deflect!', 30);
for (let k = 0; k < 8; k++) particles.push({ type: 'spark', x: b.x, y: b.y, text: '•', color: '#fde047', life: 14, vx: (R() - 0.5) * 8, vy: (R() - 0.5) * 8 });
break;
}
const headshot = h.part === 'head';
const dmg = Math.round(b.dmg * (headshot ? 1.6 : h.part === 'torso' ? 1 : 0.7) * (b.owner.team === 'enemy' && s.isPlayer ? DIFFICULTY[difficulty].dmg : 1));
const wasAlive = s.health > 0;
if (s.invuln) { dead = true; break; }
s.hurtPart(h.part, b.x, b.y, dmg, dirX, { bullet: b.kind !== 'orb' });
if (b.kind === 'orb') { s.slowT = Math.max(s.slowT || 0, 110); particles.push({ type: 'text', x: s.x - 30, y: s.y - 90, text: 'SLOWED', color: '#22d3ee', life: 35, vx: 0, vy: -1.5 }); }
// exit wound spray out the other side
s.blood(b.x + dirX * 8, b.y, 16, 4, dirX);
if (wasAlive) {
s.vx += dirX * 1.5;
if (headshot && s.limbs.head) { particles.push({ type: 'text', x: b.x, y: b.y - 25, text: 'HEADSHOT!', color: '#facc15', life: 40, vx: 0, vy: -2 }); }
if (s.health <= 0) {
s.state = 'ragdoll'; s.timer = 0; s.vx = dirX * 6; s.vy = -3; s.ragdollSpin = dirX * 0.15;
if (R() < 0.3) s.gibs(b.x, b.y, 6, dirX);
}
}
dead = true;
break;
}
}
if (dead) { bullets.splice(i, 1); continue; }
if (b.kind === 'orb') { // glowing clockwork orb
ctx.save(); ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 16;
ctx.fillStyle = 'rgba(34,211,238,0.85)'; ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = '#fef9c3'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + Math.cos(b.life * 0.4) * 7, b.y + Math.sin(b.life * 0.4) * 7); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y - 5); ctx.stroke();
ctx.restore();
continue;
}
ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2.5;
ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.9, b.y - b.vy * 0.9); ctx.stroke();
ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill();
}
}

// slow fields + ticking time bombs
function chronoTick() {
for (let i = slowFields.length - 1; i >= 0; i--) {
const f = slowFields[i];
if (--f.t <= 0) { slowFields.splice(i, 1); continue; }
for (const s of agents) if (s !== f.owner && s.health > 0 && Math.hypot(s.x - f.x, s.y + s.footOff - f.y) < f.r) s.slowT = Math.max(s.slowT || 0, 3);
}
for (let i = timeBombs.length - 1; i >= 0; i--) {
const b = timeBombs[i];
const g = surfaceBelow(b.x, b.y - 10);
b.vy += 0.5; b.x += b.vx; b.y += b.vy;
if (b.y >= g - 7) { b.y = g - 7; b.vy *= -0.3; b.vx *= 0.6; }
if (b.x < 20 || b.x > width - 20) b.vx *= -1;
if (b.fuse % 15 === 0) particles.push({ type: 'text', x: b.x - 6, y: b.y - 18, text: b.fuse > 30 ? 'tick' : 'TICK', color: '#a855f7', life: 12, vx: 0, vy: -1 });
if (--b.fuse <= 0 || b.y > height + 100) { if (b.y < height) explodeMine({ x: b.x - 16, y: b.y - 6, w: 32, h: 12 }); timeBombs.splice(i, 1); }
}
}
function drawChrono() {
for (const f of slowFields) { // a dome where time runs slow
const a = Math.min(1, f.t / 30);
ctx.save(); ctx.globalAlpha = a;
ctx.fillStyle = 'rgba(168,85,247,0.10)'; ctx.strokeStyle = 'rgba(192,132,252,0.7)'; ctx.lineWidth = 2;
ctx.beginPath(); ctx.arc(f.x, f.y, f.r, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
for (let k = 0; k < 12; k++) { const ang = Math.PI + (k / 11) * Math.PI + (tick * 0.002); ctx.beginPath(); ctx.moveTo(f.x + Math.cos(ang) * (f.r - 10), f.y + Math.sin(ang) * (f.r - 10)); ctx.lineTo(f.x + Math.cos(ang) * f.r, f.y + Math.sin(ang) * f.r); ctx.stroke(); }
ctx.restore();
}
for (const b of timeBombs) { // clockwork bomb
ctx.save(); ctx.translate(b.x, b.y);
ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.stroke();
ctx.strokeStyle = '#facc15'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(b.fuse * 0.3) * 6, Math.sin(b.fuse * 0.3) * 6); ctx.stroke();
ctx.fillStyle = b.fuse % 10 < 5 ? '#ef4444' : '#7f1d1d'; ctx.beginPath(); ctx.arc(0, -10, 2.5, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}
}
function drawClockOverlay(alpha, speed) { // a giant clock face over the whole screen
ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = alpha;
const cx = width / 2, cy = height / 2, r = Math.min(width, height) * 0.36;
ctx.strokeStyle = '#e9d5ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
ctx.font = `700 ${Math.round(r * 0.13)}px Georgia, serif`; ctx.fillStyle = '#e9d5ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
const numerals = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
for (let k = 0; k < 12; k++) { const a = (k / 12) * Math.PI * 2 - Math.PI / 2; ctx.fillText(numerals[k], cx + Math.cos(a) * r * 0.84, cy + Math.sin(a) * r * 0.84); }
ctx.lineCap = 'round';
ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(tick * speed * 0.1 - Math.PI / 2) * r * 0.45, cy + Math.sin(tick * speed * 0.1 - Math.PI / 2) * r * 0.45); ctx.stroke();
ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(tick * speed - Math.PI / 2) * r * 0.7, cy + Math.sin(tick * speed - Math.PI / 2) * r * 0.7); ctx.stroke();
ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
ctx.restore();
}

function step() {
ctx.setTransform(1, 0, 0, 1, 0, 0); // fixes the drifting screen-shake bug
ctx.clearRect(0, 0, width, height);
if (screenShake > 0) {
ctx.translate((R() - 0.5) * screenShake, (R() - 0.5) * screenShake);
screenShake *= 0.85;
if (screenShake < 0.5) screenShake = 0;
}

drawWorld();
drawStage();
drawDecals();
for (let i = agents.length - 1; i >= 0; i--) {
const s = agents[i];
let frozen = (timeStop && s !== timeStop.by && mouse.draggedAgent !== s);
if (!frozen && s.frozenT > 0) { s.frozenT--; frozen = true; } // stasis bubble
if (!frozen && s.slowT > 0) { s.slowT--; if (tick % 2) frozen = true; } // slowed: moves at half speed
if ((!hitStop || mouse.draggedAgent === s) && !frozen) { s.think(); s.updatePhysics(); s.animate(); }
s.draw();
}
tick++;
if (timeStop && !hitStop && (--timeStop.t <= 0 || !agents.includes(timeStop.by) || timeStop.by.health <= 0)) { // time starts again
particles.push({ type: 'ring', x: width / 2, y: height / 2, radius: Math.max(width, height), maxRadius: 10, color: '#e9d5ff', life: 25 });
timeStop = null;
}
if (!hitStop && !timeStop) stageTick();
if (!timeStop) chronoTick();
if (hitStop > 0) hitStop--;
drawChrono();
updateBullets();
drawParticles();
drawPlayerTags();
ctx.setTransform(1, 0, 0, 1, 0, 0);
drawScreenSplats();

if (banner) {
ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.globalAlpha = Math.min(1, banner.life / 20);
ctx.font = `900 38px ${uiFont()}`;
ctx.textAlign = 'center';
ctx.lineWidth = 6; ctx.strokeStyle = '#0f172a';
ctx.strokeText(banner.text, width / 2, 140, width - 60);
ctx.fillStyle = banner.color;
ctx.fillText(banner.text, width / 2, 140, width - 60);
ctx.globalAlpha = 1; ctx.textAlign = 'left';
if (--banner.life <= 0) banner = null;
}

if (timeStop) { // everything is frozen
ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.fillStyle = 'rgba(76,29,149,0.18)'; ctx.fillRect(0, 0, width, height);
drawClockOverlay(0.22, 0.004);
ctx.font = `800 18px ${uiFont()}`; ctx.fillStyle = '#e9d5ff'; ctx.textAlign = 'center';
ctx.fillText(`TIME STOPPED  ${(timeStop.t / 60).toFixed(1)}s`, width / 2, height - 100); ctx.textAlign = 'left';
}
if (clockT > 0) { clockT--; drawClockOverlay(Math.min(0.45, clockT / 40), -0.25); } // Chronarch finisher: the clock spins backwards
if (nightT > 0) { // Crimson Night: dark red sky and a huge blood moon
nightT--;
const a = Math.min(1, nightT / 30, (175 - nightT) / 20);
ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.fillStyle = `rgba(45,0,12,${0.55 * a})`; ctx.fillRect(0, 0, width, height);
ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 70;
const mx = width * 0.22, my = 300;
ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.arc(mx, my, 75, 0, Math.PI * 2); ctx.fill();
ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(127,29,29,0.6)';
ctx.beginPath(); ctx.arc(mx - 22, my - 15, 14, 0, Math.PI * 2); ctx.arc(mx + 25, my + 20, 10, 0, Math.PI * 2); ctx.arc(mx + 10, my - 30, 7, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}
if (filmT > 0) { // scratches, dust, flicker and a dark vignette, like an old film reel
filmT--;
ctx.setTransform(1, 0, 0, 1, 0, 0);
const vg = ctx.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.3, width / 2, height / 2, Math.max(width, height) * 0.72);
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
ctx.fillStyle = vg; ctx.fillRect(0, 0, width, height);
ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
for (let k = 0; k < 3; k++) if (R() < 0.6) { const sx = R() * width; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + (R() - 0.5) * 20, height); ctx.stroke(); }
ctx.fillStyle = 'rgba(0,0,0,0.5)';
for (let k = 0; k < 40; k++) ctx.fillRect(R() * width, R() * height, 1.5, 1.5);
ctx.fillStyle = `rgba(255,255,255,${R() * 0.07})`; ctx.fillRect(0, 0, width, height);
}
const wantFilter = filmT > 0 ? 'grayscale(1) contrast(1.15)' : timeStop || clockT > 0 ? 'saturate(0.35) hue-rotate(15deg)' : '';
if (wantFilter !== lastFilter) { canvas.style.filter = wantFilter; lastFilter = wantFilter; }
if (flashFrame > 0) {
ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.fillStyle = `rgba(255,255,255,${flashFrame * 0.3})`;
ctx.fillRect(0, 0, width, height);
flashFrame--;
}
playTick();
}

// runs the game at a steady 60 steps per second no matter how fast the screen refreshes
const TICK = 1000 / 60;
let lastTime = performance.now(), acc = 0;
function gameLoop(now = performance.now()) {
if (!running) return;
if (net && net.started) { netLoop(now); requestAnimationFrame(gameLoop); return; }
acc += Math.min(100, now - lastTime); lastTime = now;
let n = 0;
while (acc >= TICK && n < 4) { step(); acc -= TICK; n++; }
if (n === 4) acc = 0; // computer fell behind: don't try to catch up all at once
requestAnimationFrame(gameLoop);
}

// where to put a new fighter: normal floor, or on top of one of your blocks
function spawnPoint(prefX) {
if (!noFloor) return { x: prefX ?? width / 2 + (R() - 0.5) * 200, y: height - 80 };
const tops = stage.filter((b) => SOLID.has(b.type) && b.y > 40 && b.y < height);
if (!tops.length) { showToast('Build some ground first! 🧱'); return { x: prefX ?? width / 2, y: 60 }; }
// find a safe spot: on top of a block, with nothing above it, and no trap right there
const HAZ = ['lava', 'spikes', 'saw', 'mine', 'crusher', 'laser'];
const safe = (x, top) => surfaceBelow(x, top - 90) >= top - 1 && !stage.some((h) => HAZ.includes(h.type) && x > h.x - 30 && x < h.x + h.w + 30 && h.y < top + 10 && h.y + h.h > top - 260);
const order = prefX != null ? [...tops].sort((a, c) => Math.abs(a.x + a.w / 2 - prefX) - Math.abs(c.x + c.w / 2 - prefX)) : tops.sort(() => R() - 0.5);
for (const b of order) for (let k = 0; k < 8; k++) {
const x = b.x + 10 + R() * Math.max(1, b.w - 20), top = surfaceTop(b, x);
if (safe(x, top)) return { x, y: top - 60 };
}
const b = order[0], x = b.x + b.w / 2; // nowhere safe: just use the closest block
return { x, y: surfaceTop(b, x) - 60 };
}

// Ctrl + Shift + Z: every dead body gets back up as a zombie
function raiseZombies() {
const dead = agents.filter((s) => s.health <= 0 && !s.fallen && !s.isPlayer);
if (!dead.length) { showToast('No bodies to raise... yet 🧟'); return; }
for (const s of dead) s.becomeZombie();
banner = { text: 'THE DEAD RISE!', color: '#84cc16', life: 100 };
screenShake = 14; flashFrame = 3;
showToast(`${dead.length} zombie${dead.length === 1 ? '' : 's'} rose from the dead! 🧟`);
}

function makePlayer(role, x, which = 0, hpOverride) { // which: 0 = solo, 1 = P1, 2 = P2

function startRound() {

}
function duelTick() {
if (duel.done) return; // match already decided
const e = duel.enemy;
if (!duel.over) {
const pDead = player.health <= 0, eDead = e.health <= 0 || !agents.includes(e);
if (pDead || eDead) {
duel.over = 140;
if (eDead && !pDead) { duel.pWins++; banner = { text: duel.versus ? 'K.O.! PLAYER 1 WINS THE ROUND' : 'K.O.! YOU WIN THE ROUND', color: duel.versus ? '#3b82f6' : '#22c55e', life: 110 }; }
else if (pDead && !eDead) { duel.eWins++; banner = { text: duel.versus ? 'K.O.! PLAYER 2 WINS THE ROUND' : `K.O.! ${duel.oppRole.toUpperCase()} WINS THE ROUND`, color: '#ef4444', life: 110 }; }
else banner = { text: 'DOUBLE K.O.!', color: '#facc15', life: 110 };
}
} else if (--duel.over === 0) {
if (duel.pWins >= 2 || duel.eWins >= 2) { duel.done = true; showDuelEnd(); }
else { duel.round++; startRound(); }
}
}
function showDuelEnd() {

function netLoop(now) {

function startWave(n) {

const dead = agents.filter((s) => s.health <= 0 && !s.isPlayer);
if (dead.length > 10) { const drop = new Set(dead.slice(0, dead.length - 10)); agents = agents.filter((s) => !drop.has(s)); }
const count = DIFFICULTY[difficulty].wave(n);
for (let i = 0; i < count; i++) {
const left = i % 2 === 0;
const sp = spawnPoint(left ? 0 : width);
const s = new Stickman(noFloor ? sp.x : left ? 50 + R() * 60 : width - 50 - R() * 60, sp.y, pick(Object.keys(ROLE_INFO)));
s.team = 'enemy'; s.aggression = 0.95; s.dir = left ? 1 : -1; s.face = s.dir;

blood(amount = 2) { setGore(Math.max(0, Math.min(3, amount))); return `Blood amount x${gore}`; },
quit() { quit(); return 'Bye!'; },
play(role = 'brawler') { if (!ROLE_INFO[role]) return `Pick one of: ${Object.keys(ROLE_INFO).join(', ')}`; startPlay(role); return `Playing as ${role}`; },
watch() { startWatch(); return 'Watching'; },
duel(role = 'brawler', vs = pick(Object.keys(ROLE_INFO))) { if (!ROLE_INFO[role] || !ROLE_INFO[vs]) return `Pick from: ${Object.keys(ROLE_INFO).join(', ')}`; startDuel(role, vs); return `${role} vs ${vs}!`; },
difficulty(level = 'normal') { if (!DIFFICULTY[level]) return `Pick one of: ${Object.keys(DIFFICULTY).join(', ')}`; setDifficulty(level); return `Difficulty: ${level}`; },
menu() { toMainMenu(); return 'Main menu'; },
help() {
console.log('%cStickman commands:\n' +
' stickman.overlay() – fight on top of the real website (page stays usable)\n' +
' stickman.arena() – bring the arena background back\n' +
' stickman.toggle() – switch between the two\n' +
" stickman.spawn('ninja', 5) – spawn fighters (brawler, ninja, monk, gunslinger)\n" +
' stickman.clear() – clear bodies and gore\n' +
' stickman.blood(3) – set the blood amount (0 = none)\n' +
' stickman.play(\'ninja\') – play as a class   stickman.watch() / stickman.menu()\n' +
' stickman.quit() – close it', 'color:#10b981');
return 'See above.';
},
};

refreshBinds();
// Start on the Play / Watch menu
showStartMenu();
gameLoop();
console.log('%cOTM Stickmen loaded! Type stickman.overlay() to fight on the website. stickman.help() for all commands.', 'color:#10b981;font-weight:bold');
})();
</script>
<script>
// when the game is closed with Esc, show a button to start it again
setInterval(() => { document.getElementById('again').style.display = document.getElementById('stickman-engine') ? 'none' : 'flex'; }, 500);
</script>
